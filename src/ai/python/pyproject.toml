[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "helios-agents"
version = "0.1.0"
description = "Python analysis spoke for the HELIOS AIHub: routing-outcome analytics and text work behind a subprocess JSON boundary."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# The spoke runs dependency-free anywhere (Cloud Shell, Codespaces, bare Linux);
# these extras swap pure-Python math for the real libraries when installed.
ml = ["numpy>=1.26", "scikit-learn>=1.4"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["helios_agents*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
