name: CI - Code Validation & Testing

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    name: Preflight Validation
    steps:
      - uses: actions/checkout@v4

      - name: Validate workflow prerequisites
        run: |
          set -euo pipefail
          start_time=$(date +%s)
          test -f HELIOS.sln
          test -d .github/workflows
          pwsh --version
          python3 --version
          dotnet --version
          end_time=$(date +%s)
          {
            echo "## Preflight"
            echo "- Workflow files: $(find .github/workflows -maxdepth 1 -name '*.yml' | wc -l)"
            echo "- Duration: $((end_time - start_time))s"
          } >> "$GITHUB_STEP_SUMMARY"

  syntax-check:
    runs-on: ubuntu-latest
    name: PowerShell Syntax Validation
    needs: preflight
    
    steps:
      - uses: actions/checkout@v4

      # pwsh ships preinstalled on ubuntu-latest; actions/setup-powershell does not exist.
      # Real parser (Parser::ParseFile), gated against a baseline: 54 legacy scripts
      # carry genuine pre-existing parse errors (.github/ps1-parse-baseline.txt), so a
      # blanket gate would always be red and a blanket skip (the old continue-on-error,
      # whose scriptblock::Create check also space-joined files and reported nonsense)
      # would mask regressions. Errors in any file NOT in the baseline fail the job;
      # repaired baseline files are reported so their lines get removed.
      - name: Check PowerShell Syntax
        shell: pwsh
        run: |
          $baselinePath = '.github/ps1-parse-baseline.txt'
          $baseline = @{}
          if (Test-Path $baselinePath) {
            Get-Content $baselinePath | Where-Object { $_ -and -not $_.StartsWith('#') } |
              ForEach-Object { $baseline[$_.Trim()] = $true }
          }
          $root = (Get-Location).Path
          $failures = 0
          $stillBroken = 0
          $repaired = [System.Collections.Generic.List[string]]::new()
          Get-ChildItem -Path '.' -Filter '*.ps1' -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
            $rel = $_.FullName.Substring($root.Length + 1).Replace('\', '/')
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              if ($baseline.ContainsKey($rel)) {
                $stillBroken++
              }
              else {
                Write-Host "❌ $($rel): $($errors[0].Message)" -ForegroundColor Red
                $failures++
              }
            }
            elseif ($baseline.ContainsKey($rel)) {
              $repaired.Add($rel)
            }
          }
          if ($repaired.Count -gt 0) {
            Write-Host "🎉 Repaired since baselining (remove from $baselinePath):"
            $repaired | ForEach-Object { Write-Host "   $_" }
          }
          Write-Host "Baseline: $stillBroken known-broken legacy file(s) tolerated."
          if ($failures -gt 0) {
            Write-Host "Syntax check failed for $failures non-baseline file(s)" -ForegroundColor Red
            exit 1
          }
          Write-Host "✅ No parse errors outside the legacy baseline"

  markdown-check:
    runs-on: ubuntu-latest
    name: Markdown Validation
    needs: preflight
    
    steps:
      - uses: actions/checkout@v4

      - name: Cache npm package data
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: markdownlint-npm-${{ runner.os }}-0.33.0
          restore-keys: markdownlint-npm-${{ runner.os }}-
      
      # Plain npm install instead of the Docker-based action: the action builds
      # its container FROM docker.io at run time, Docker Hub pulls from CI
      # runners have repeatedly timed out here, and that container build fails
      # the step before continue-on-error can absorb it.
      - name: Run markdownlint
        run: |
          npm install --global --no-fund --no-audit markdownlint-cli@0.33.0
          markdownlint --config .markdownlint.json .
        continue-on-error: true

  documentation-check:
    runs-on: ubuntu-latest
    name: Documentation Completeness
    needs: preflight
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Check Required Documentation
        run: |
          required_docs=(
            "README.md"
          )
          
          missing=0
          for doc in "${required_docs[@]}"; do
            if [ ! -f "$doc" ]; then
              echo "❌ Missing required documentation: $doc"
              missing=$((missing + 1))
            else
              echo "✅ Found: $doc"
            fi
          done
          
          if [ $missing -eq 0 ]; then
            echo "✅ All required documentation present!"
          else
            echo "⚠️  Some documentation missing (non-blocking)"
          fi

  test-scripts:
    runs-on: ubuntu-latest
    name: Test PowerShell Scripts
    needs: preflight
    
    steps:
      - uses: actions/checkout@v4

      - name: Run Unit Tests
        run: |
          if (Test-Path -Path "src/tests" -ErrorAction SilentlyContinue) {
            Get-ChildItem -Path "src/tests" -Filter "*.tests.ps1" -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "Running: $($_.FullName)" -ForegroundColor Cyan
              & $_.FullName
            }
          } else {
            Write-Host "No tests directory found" -ForegroundColor Yellow
          }
        shell: pwsh
        continue-on-error: true

  security-scan:
    runs-on: ubuntu-latest
    name: Security Scanning
    needs: preflight
    # Only this job uploads SARIF; the write grant stays scoped to it.
    permissions:
      contents: read
      security-events: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true
      
      - name: Upload Trivy Results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

  file-integrity:
    runs-on: ubuntu-latest
    name: File Structure Validation
    needs: preflight
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Validate Directory Structure
        run: |
          required_dirs=(
            "src"
            "docs"
          )
          
          missing=0
          for dir in "${required_dirs[@]}"; do
            if [ ! -d "$dir" ]; then
              echo "❌ Missing required directory: $dir"
              missing=$((missing + 1))
            else
              echo "✅ Found: $dir"
            fi
          done
          
          if [ $missing -eq 0 ]; then
            echo "✅ Directory structure is valid!"
          else
            exit 1
          fi

  validation-summary:
    name: Validation Summary
    if: always()
    needs: [preflight, syntax-check, markdown-check, documentation-check, test-scripts, security-scan, file-integrity]
    runs-on: ubuntu-latest
    steps:
      - name: Report Status
        run: |
          {
            echo "## Validation Results"
            echo ""
            echo "- Preflight: ${{ needs.preflight.result }}"
            echo "- Syntax Check: ${{ needs.syntax-check.result }}"
            echo "- Markdown Check: ${{ needs.markdown-check.result }}"
            echo "- Documentation: ${{ needs.documentation-check.result }}"
            echo "- Script Tests: ${{ needs.test-scripts.result }}"
            echo "- Security Scan: ${{ needs.security-scan.result }}"
            echo "- File Integrity: ${{ needs.file-integrity.result }}"
          } >> "$GITHUB_STEP_SUMMARY"
