name: CI - Code Validation & Testing

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    name: Preflight Validation
    steps:
      - uses: actions/checkout@v4

      - name: Validate workflow prerequisites
        run: |
          set -euo pipefail
          start_time=$(date +%s)
          test -f HELIOS.sln
          test -d .github/workflows
          pwsh --version
          python3 --version
          dotnet --version
          end_time=$(date +%s)
          {
            echo "## Preflight"
            echo "- Workflow files: $(find .github/workflows -maxdepth 1 -name '*.yml' | wc -l)"
            echo "- Duration: $((end_time - start_time))s"
          } >> "$GITHUB_STEP_SUMMARY"

  syntax-check:
    runs-on: ubuntu-latest
    name: PowerShell Syntax Validation
    needs: preflight
    
    steps:
      - uses: actions/checkout@v4

      # pwsh ships preinstalled on ubuntu-latest; actions/setup-powershell does not exist.
      # Real parser (Parser::ParseFile), gated against a baseline: 54 legacy scripts
      # carry genuine pre-existing parse errors (.github/ps1-parse-baseline.txt), so a
      # blanket gate would always be red and a blanket skip (the old continue-on-error,
      # whose scriptblock::Create check also space-joined files and reported nonsense)
      # would mask regressions. Errors in any file NOT in the baseline fail the job;
      # repaired baseline files are reported so their lines get removed.
      - name: Check PowerShell Syntax
        shell: pwsh
        run: |
          $baselinePath = '.github/ps1-parse-baseline.txt'
          $baseline = @{}
          if (Test-Path $baselinePath) {
            Get-Content $baselinePath | Where-Object { $_ -and -not $_.StartsWith('#') } |
              ForEach-Object { $baseline[$_.Trim()] = $true }
          }
          $root = (Get-Location).Path
          $failures = 0
          $stillBroken = 0
          $repaired = [System.Collections.Generic.List[string]]::new()
          Get-ChildItem -Path '.' -Filter '*.ps1' -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
            $rel = $_.FullName.Substring($root.Length + 1).Replace('\', '/')
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              if ($baseline.ContainsKey($rel)) {
                $stillBroken++
              }
              else {
                Write-Host "❌ $($rel): $($errors[0].Message)" -ForegroundColor Red
                $failures++
              }
            }
            elseif ($baseline.ContainsKey($rel)) {
              $repaired.Add($rel)
            }
          }
          if ($repaired.Count -gt 0) {
            Write-Host "🎉 Repaired since baselining (remove from $baselinePath):"
            $repaired | ForEach-Object { Write-Host "   $_" }
          }
          Write-Host "Baseline: $stillBroken known-broken legacy file(s) tolerated."
          if ($failures -gt 0) {
            Write-Host "Syntax check failed for $failures non-baseline file(s)" -ForegroundColor Red
            exit 1
          }
          Write-Host "✅ No parse errors outside the legacy baseline"

  markdown-check:
    runs-on: ubuntu-latest
    name: Markdown Validation
    needs: preflight
    
    steps:
      - uses: actions/checkout@v4

      - name: Cache npm package data
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: markdownlint-npm-${{ runner.os }}-0.33.0
          restore-keys: markdownlint-npm-${{ runner.os }}-
      
      # Plain npm install instead of the Docker-based action: the action builds
      # its container FROM docker.io at run time, Docker Hub pulls from CI
      # runners have repeatedly timed out here, and that container build fails
      # the step before continue-on-error can absorb it.
      - name: Run markdownlint
        run: |
          npm install --global --no-fund --no-audit markdownlint-cli@0.33.0
          shopt -s nullglob
          files=(
            README.md
            docs/README.md
            docs/DOCUMENTATION_INDEX.md
            docs/CONSOLIDATION_BLUEPRINT.md
            docs/PROJECT_SETUP.md
            docs/OWNER_START_HERE.md
            docs/TEST_RUN_PLAYBOOK.md
            docs/ROADMAP.md
            docs/migration/yolkster-control-cutover/CANONICAL-ISSUE-LEDGER.md
            docs/migration/yolkster-control-cutover/CURRENT-AUTHORITY.md
            docs/migration/yolkster-control-cutover/CUTOVER-RUNBOOK.md
          )
          markdownlint --config .markdownlint.json "${files[@]}"
        continue-on-error: true

  documentation-check:
    runs-on: ubuntu-latest
    name: Documentation Completeness
    needs: preflight
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Check Required Documentation
        run: |
          required_docs=(
            "README.md"
          )
          
          missing=0
          for doc in "${required_docs[@]}"; do
            if [ ! -f "$doc" ]; then
              echo "❌ Missing required documentation: $doc"
              missing=$((missing + 1))
            else
              echo "✅ Found: $doc"
            fi
          done
          
          if [ $missing -eq 0 ]; then
            echo "✅ All required documentation present!"
          else
            echo "⚠️  Some documentation missing (non-blocking)"
          fi

  test-scripts:
    runs-on: ubuntu-latest
    name: Test PowerShell Scripts
    needs: preflight
    
    steps:
      - uses: actions/checkout@v4

      - name: Run Unit Tests
        run: |
          if (Test-Path -Path "src/tests" -ErrorAction SilentlyContinue) {
            Get-ChildItem -Path "src/tests" -Filter "*.tests.ps1" -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "Running: $($_.FullName)" -ForegroundColor Cyan
              & $_.FullName
            }
          } else {
            Write-Host "No tests directory found" -ForegroundColor Yellow
          }
        shell: pwsh
        continue-on-error: true

  security-scan:
    runs-on: ubuntu-latest
    name: Security Scanning
    needs: preflight
    # Only this job uploads SARIF; the write grant stays scoped to it.
    permissions:
      contents: read
      security-events: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true
      
      - name: Upload Trivy Results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

  file-integrity:
    runs-on: ubuntu-latest
    name: File Structure Validation
    needs: preflight
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Validate Directory Structure
        run: |
          required_dirs=(
            "src"
            "docs"
          )
          
          missing=0
          for dir in "${required_dirs[@]}"; do
            if [ ! -d "$dir" ]; then
              echo "❌ Missing required directory: $dir"
              missing=$((missing + 1))
            else
              echo "✅ Found: $dir"
            fi
          done
          
          if [ $missing -eq 0 ]; then
            echo "✅ Directory structure is valid!"
          else
            exit 1
          fi

  # Informational only: continue-on-error at the job level, absent from
  # validation-summary's needs list, and never a required check. CLAUDE.md, AGENTS.md
  # and .github/copilot-instructions.md carry two sections that must stay identical
  # ("Hard rules", "Multi-LLM hub"); this surfaces the drift as a table in the job
  # summary without blocking a merge, because the fix is a documentation edit.
  instructions-drift:
    runs-on: ubuntu-latest
    name: Instructions drift (informational)
    needs: preflight
    continue-on-error: true
    permissions:
      contents: read
    concurrency:
      group: instructions-drift-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      # Read-only: the script only reads the two compared files (AGENTS.md is the
      # owner's cutover contract with its own structure and is not compared). The exact command is
      # printed first so the log line is replayable on a workstation, and ALL output
      # is captured before $LASTEXITCODE is read (repo pipeline-trap rule).
      - name: Diff the shared sections of CLAUDE.md and copilot-instructions.md
        shell: pwsh
        run: |
          Write-Host 'pwsh scripts/verify/instructions-drift.ps1 -Json'
          $lines = @(& pwsh -NoProfile -File scripts/verify/instructions-drift.ps1 -Json 2>&1 | ForEach-Object { "$_" })
          $exit = [int]$LASTEXITCODE
          $report = $null
          try { $report = ($lines -join "`n") | ConvertFrom-Json } catch { Write-Host "drift report did not parse: $($_.Exception.Message)" }
          $summary = [System.Collections.Generic.List[string]]::new()
          $summary.Add('## Instructions drift (informational)')
          $summary.Add('')
          if ($null -eq $report) {
            $summary.Add("The drift script produced no parseable report (exit $exit); see the job log.")
            $lines | ForEach-Object { Write-Host $_ }
          }
          else {
            $summary.Add('| Section | Left | Right | Result |')
            $summary.Add('| --- | --- | --- | --- |')
            foreach ($c in @($report.comparisons)) {
              $result = if ($c.identical) { "identical ($($c.leftItems) items)" } else { "drift (+$($c.added) / -$($c.removed) items)" }
              $summary.Add("| $($c.section) | $($c.left) | $($c.right) | $result |")
            }
            foreach ($m in @($report.missing)) { $summary.Add("| (precondition) | | | $m |") }
            $summary.Add('')
            $summary.Add("Exit $exit (0 identical, 1 drift, 2 file or section missing). Fix: align the drifted section(s), then re-run ``pwsh scripts/verify/instructions-drift.ps1``. This job never gates a merge.")
            foreach ($c in @($report.comparisons | Where-Object { -not $_.identical })) {
              Write-Host "::group::$($c.section): $($c.left) vs $($c.right)"
              $c.diff | ForEach-Object { Write-Host $_ }
              Write-Host '::endgroup::'
            }
          }
          ($summary -join "`n") | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          exit $exit

  validation-summary:
    name: Validation Summary
    if: always()
    needs: [preflight, syntax-check, markdown-check, documentation-check, test-scripts, security-scan, file-integrity]
    runs-on: ubuntu-latest
    steps:
      # Job results travel through env rather than inline expressions: nothing
      # from an expression is ever substituted into the script text.
      - name: Report Status
        env:
          R_PREFLIGHT: ${{ needs.preflight.result }}
          R_SYNTAX: ${{ needs.syntax-check.result }}
          R_MARKDOWN: ${{ needs.markdown-check.result }}
          R_DOCS: ${{ needs.documentation-check.result }}
          R_TESTS: ${{ needs.test-scripts.result }}
          R_SECURITY: ${{ needs.security-scan.result }}
          R_FILES: ${{ needs.file-integrity.result }}
        run: |
          {
            echo "## Validation Results"
            echo ""
            echo "- Preflight: ${R_PREFLIGHT}"
            echo "- Syntax Check: ${R_SYNTAX}"
            echo "- Markdown Check: ${R_MARKDOWN}"
            echo "- Documentation: ${R_DOCS}"
            echo "- Script Tests: ${R_TESTS}"
            echo "- Security Scan: ${R_SECURITY}"
            echo "- File Integrity: ${R_FILES}"
          } >> "$GITHUB_STEP_SUMMARY"
