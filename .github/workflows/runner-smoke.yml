name: Self-Hosted Runner Smoke

# Proof of life for newly registered self-hosted runners
# (scripts/runners/register-runner.sh / .ps1). Dispatch it, watch it pick the
# job up, exit green — that is the whole test.
#
# DELIBERATELY workflow_dispatch-only: a push/PR trigger targeting
# `self-hosted` would queue forever (and hang required checks) whenever no
# self-hosted runner is online — e.g. on forks, or before the first runner is
# registered. A job that only a human fires can never wedge CI.
#
# `runs-on: helios-runners` is the ONE canonical self-hosted label: it is the
# ARC runner scale-set name (infra/runners/arc-values.yaml
# runnerScaleSetName), which GitHub exposes as the label of every scale-set
# runner, and register-runner.* applies the same label first
# (helios-runners,helios,xcore + extras) to hand-registered runners — so this
# smoke job can land on either kind. Pool-specific labels (e.g. xcore-native,
# see config/fleet/fleet-topology.json) are ON TOP of these. Scale sets never
# match `[self-hosted, ...]` label arrays, so do not reintroduce one here.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Runner proof of life
    runs-on: helios-runners
    # Belt and braces: if the job is picked up but the runner hangs, don't
    # occupy it for the default 360 minutes.
    timeout-minutes: 5
    steps:
      - name: Report runner identity
        # GitHub-expression interpolation (${{ }}) is substituted BEFORE any
        # shell runs, so this works under every default shell — bash, pwsh,
        # powershell 5.1, or cmd. register-runner.* guarantees no particular
        # shell on the box, so the workflow must assume none.
        run: |
          echo "runner name : ${{ runner.name }}"
          echo "runner os   : ${{ runner.os }} (${{ runner.arch }})"
          echo "environment : ${{ runner.environment }}"
          echo "matched via : runs-on helios-runners (the ARC scale-set name; register-runner.* applies the same label to hand-registered runners; the full set is in Settings -> Actions -> Runners)"
      - name: Exit green
        run: echo "Self-hosted runner is alive and accepting jobs."
