name: Authentication Contracts

on:
  pull_request:
    paths:
      - 'scripts/verify/rest-connect.ps1'
      - 'scripts/bootstrap/auth-doctor.ps1'
      - 'scripts/bootstrap/auto-login.ps1'
      - 'scripts/verify/tests/test_auth_continuation.ps1'
      - 'scripts/verify/tests/test_auth_readiness.ps1'
      - 'scripts/verify/tests/test_auth_boundaries.ps1'
      - 'scripts/verify/tests/test_auth_config.ps1'
      - 'scripts/bootstrap/connect-devices.ps1'
      - 'scripts/bootstrap/connect-devices.sh'
      - 'scripts/bootstrap/connect-github-app.ps1'
      - 'scripts/verify/tests/test_connect_devices.ps1'
      - 'scripts/verify/tests/test_connect_github_app.ps1'
      - 'scripts/bootstrap/connect.ps1'
      - 'scripts/bootstrap/connect.sh'
      - 'scripts/verify/tests/test_connect.ps1'
      - '.github/workflows/auth-contracts.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/verify/rest-connect.ps1'
      - 'scripts/bootstrap/auth-doctor.ps1'
      - 'scripts/bootstrap/auto-login.ps1'
      - 'scripts/verify/tests/test_auth_continuation.ps1'
      - 'scripts/verify/tests/test_auth_readiness.ps1'
      - 'scripts/verify/tests/test_auth_boundaries.ps1'
      - 'scripts/verify/tests/test_auth_config.ps1'
      - 'scripts/bootstrap/connect-devices.ps1'
      - 'scripts/bootstrap/connect-devices.sh'
      - 'scripts/bootstrap/connect-github-app.ps1'
      - 'scripts/verify/tests/test_connect_devices.ps1'
      - 'scripts/verify/tests/test_connect_github_app.ps1'
      - 'scripts/bootstrap/connect.ps1'
      - 'scripts/bootstrap/connect.sh'
      - 'scripts/verify/tests/test_connect.ps1'
      - '.github/workflows/auth-contracts.yml'

permissions:
  contents: read

jobs:
  offline-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify credential continuation and environment-name semantics
        shell: pwsh
        run: |
          ./scripts/verify/tests/test_auth_continuation.ps1
          ./scripts/verify/tests/test_auth_readiness.ps1
          ./scripts/verify/tests/test_auth_boundaries.ps1
          ./scripts/verify/tests/test_auth_config.ps1
      # The device-code helper and the GitHub App registration script: inert gh/az
      # shims on PATH, no network, so the login and secret-handling contracts are
      # proven on every change to either script.
      - name: Verify the device-code helper and the GitHub App registration contracts
        shell: pwsh
        run: |
          ./scripts/verify/tests/test_connect_devices.ps1
          ./scripts/verify/tests/test_connect_github_app.ps1
      # The one connect command, both twins, with their .ps1 children pointed at a shim
      # through HELIOS_PWSH: proves a read-only run mutates nothing, never reaches
      # auto-login.ps1 (which can replace the az profile), and reads each lane's state from
      # the report rather than from an exit code.
      - name: Verify the connect orchestrator contracts
        shell: pwsh
        run: ./scripts/verify/tests/test_connect.ps1
