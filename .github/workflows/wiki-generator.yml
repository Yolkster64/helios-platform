name: Wiki Sync

# Mirrors curated docs into the GitHub wiki (Yolkster64/helios-platform.wiki.git)
# with a flattened naming scheme:
#   docs/GETTING_STARTED.md     -> Getting-Started.md
#   docs/architecture/<NAME>.md -> Architecture-<NAME>.md
#   docs/mcp/<NAME>.md          -> Mcp-<NAME>.md
# plus a generated _Sidebar.md. Commit-if-changed, so re-runs are no-ops.
#
# This replaces the previous wiki-generator.yml, which fabricated content
# (invented build variants, a sqlite "wiki db", HTML force-pushed to main) and
# never touched the actual wiki — see the known-red workflow inventory in
# docs/architecture/ROADMAP_MULTI_LLM.md.
#
# If the wiki git repo does not exist yet (GitHub only creates it when the
# first wiki page is created in the UI), the job logs a notice with that one
# manual step and exits green.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/wiki-generator.yml'
  workflow_dispatch:

# contents: write is what lets GITHUB_TOKEN push to <repo>.wiki.git — the wiki
# is part of the repository for permission purposes.
permissions:
  contents: write

concurrency:
  group: wiki-sync
  cancel-in-progress: false # queue rather than cancel: never interrupt a half-pushed wiki update

jobs:
  sync-wiki:
    name: Sync docs/ to GitHub wiki
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone wiki repo (skip cleanly if it does not exist yet)
        id: clone
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          if git clone "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.wiki.git" wiki; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Wiki not initialized::${REPO}.wiki.git does not exist yet. One manual step: open https://github.com/${REPO}/wiki and create the first page (any content) — GitHub materializes the wiki git repo at that moment. Then re-run this workflow (Actions -> Wiki Sync -> Run workflow)."
            echo "Wiki repo missing; nothing to sync. Exiting green."
          fi

      - name: Flatten docs into wiki pages
        if: steps.clone.outputs.exists == 'true'
        env:
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Remove previously synced pages first so renames/deletions in docs/
          # do not leave stale wiki pages. Hand-written pages (Home.md, etc.)
          # are untouched.
          rm -f wiki/Getting-Started.md wiki/Architecture-*.md wiki/Mcp-*.md wiki/_Sidebar.md

          # Every published page is rewritten by scripts/wiki/rewrite_links.py: a
          # relative link to another published page becomes that page's name, a
          # link to any other repository file becomes an absolute GitHub URL, and a
          # target that does not exist in the checkout is left as written and
          # reported as a warning. The repository copies keep their relative links.
          python3 scripts/wiki/rewrite_links.py --self-test
          python3 scripts/wiki/rewrite_links.py --repo "$REPO" --ref "$REF" --out wiki \
            docs/GETTING_STARTED.md docs/architecture/*.md docs/mcp/*.md

          # _Sidebar.md — wiki links are [[Page-Name]] (file name minus .md).
          {
            echo '## HELIOS docs'
            echo
            echo '### Start here'
            [ -e wiki/Getting-Started.md ] && echo '- [[Getting-Started]]'
            echo
            echo '### Architecture'
            for f in wiki/Architecture-*.md; do
              [ -e "$f" ] || continue
              echo "- [[$(basename "$f" .md)]]"
            done
            echo
            echo '### MCP'
            for f in wiki/Mcp-*.md; do
              [ -e "$f" ] || continue
              echo "- [[$(basename "$f" .md)]]"
            done
            echo
            echo '_Auto-synced from `docs/` by wiki-generator.yml — edit the repo, not these wiki pages._'
          } > wiki/_Sidebar.md

          ls -1 wiki

      - name: Commit and push if changed
        if: steps.clone.outputs.exists == 'true'
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki already up to date — nothing to push."
          else
            git commit -m "docs: sync wiki from docs/ at ${COMMIT_SHA}"
            git push origin HEAD
          fi
