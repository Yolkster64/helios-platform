name: Component Analysis & Metrics

on:
  push:
    branches: [ main ]
    paths:
      - 'COMPONENT_ANALYSIS.md'
      - 'COMPONENT_METRICS.json'
      - '.github/workflows/analysis.yml'
  schedule:
    - cron: '0 0 * * 0'  # Weekly analysis

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Components & Generate Metrics
    runs-on: ubuntu-latest
    # The "Comment on commit" step calls git.createCommit through GITHUB_TOKEN,
    # which is a contents write; every other step only reads the checkout.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Validate Metrics JSON
        run: |
          python3 <<'PY'
          import json

          with open('COMPONENT_METRICS.json', encoding='utf-8') as handle:
              data = json.load(handle)

          print('✅ Metrics JSON valid')
          print(f"  Components: {len(data.get('components', {}))}")
          print(f"  Phases: {len(data.get('phases', {}))}")
          PY
      
      - name: Generate Analysis Report
        run: |
          python3 <<'PY' > analysis-report.txt
          import json

          with open('COMPONENT_METRICS.json', encoding='utf-8') as handle:
              metrics = json.load(handle)

          total_time = sum(
              phase.get('time', 0)
              for phase in metrics.get('phases', {}).values()
          )
          components = metrics.get('components', {})
          performance = metrics.get('metrics', {}).get('performance', {}).get('boot_time_reduction', 0)
          security_layers = metrics.get('metrics', {}).get('security', {}).get('layers', 0)

          print('📊 HELIOS Component Analysis Report')
          print('=' * 50)
          print(f'Components Analyzed: {len(components)}')
          print(f'Total Deployment Time: {total_time} minutes')
          print(f'Performance Improvement: {performance}%')
          print(f'Security Layers: {security_layers}')
          PY
      
      - name: Upload Report
        if: ${{ always() && hashFiles('analysis-report.txt') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: analysis-report
          path: analysis-report.txt
          if-no-files-found: error
      
      - name: Publish analysis summary
        if: ${{ always() }}
        run: |
          {
            echo "## Component analysis"
            if [ -f analysis-report.txt ]; then
              cat analysis-report.txt
            else
              echo "analysis-report.txt was not generated because an earlier step failed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
