# Historical name retained for the Slack/dashboard workflow subscribers.
# Preview only: there is no resource creation or apply path in this workflow.
name: Helios Platform Deploy

on:
  workflow_dispatch:
    inputs:
      what_if:
        description: Preview only; false is rejected because deployment is disabled
        type: boolean
        default: true
      azure_tenant_id:
        description: Explicit tenant ID matching the protected azure-dev binding
        type: string
        required: true
      azure_subscription_id:
        description: Explicit subscription ID matching the protected azure-dev binding
        type: string
        required: true
      azure_resource_group:
        description: Explicit EXISTING resource group matching the azure-dev binding
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: helios-azure-preview
  cancel-in-progress: false

env:
  HELIOS_WHAT_IF: ${{ inputs.what_if }}
  HELIOS_AZURE_PREVIEW_ENABLED: ${{ vars.HELIOS_AZURE_PREVIEW_ENABLED }}
  AZURE_TENANT_ID: ${{ inputs.azure_tenant_id }}
  AZURE_SUBSCRIPTION_ID: ${{ inputs.azure_subscription_id }}
  AZURE_RESOURCE_GROUP: ${{ inputs.azure_resource_group }}

jobs:
  validate-request:
    name: Validate explicit preview request (no Azure login)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact dispatch revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Reject disabled preview, apply requests, and untrusted sources
        shell: bash
        run: bash scripts/validation/azure_deployment_preview.sh check-inputs

  preview:
    name: Validate and preview existing Azure target (never apply)
    needs: validate-request
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'Yolkster64/helios-platform' &&
      github.ref == 'refs/heads/main' && inputs.what_if
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: azure-dev
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_BOUND_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_BOUND_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_BOUND_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
    steps:
      - name: Checkout exact dispatch revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify protected-environment target binding before login
        shell: bash
        run: bash scripts/validation/azure_deployment_preview.sh check-binding

      # The federated subject must match the ACTUAL azure-dev environment subject,
      # including immutable/custom claims where configured. Never fall back to the
      # old main-ref or production identity. See AZURE_DEPLOYMENT_GUARD.md.
      - name: Azure Login (preview-only OIDC identity)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ inputs.azure_tenant_id }}
          subscription-id: ${{ inputs.azure_subscription_id }}

      - name: Validate existing target and run resource-ID-only what-if
        shell: bash
        run: bash scripts/validation/azure_deployment_preview.sh preview

      - name: Record preview outcome
        shell: bash
        run: |
          printf '%s\n' \
            '### Azure preview completed' \
            'ARM validation and resource-ID-only what-if succeeded for the explicit existing target.' \
            'No deployment, resource-group creation, identity, role, or credential change was performed.' \
            'This is preview evidence only, not approval or proof of live deployment.' >> "$GITHUB_STEP_SUMMARY"
