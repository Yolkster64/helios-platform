name: Helios Platform Deploy

on:
  push:
    branches: [main]
    paths: ['infra/**']
  workflow_dispatch:
    inputs:
      what_if:
        description: Run what-if instead of deploying
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: helios-deploy
  cancel-in-progress: false

env:
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'rg-helios-ai' }}
  AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'eastus2' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Azure OIDC configuration
        id: creds
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID || secrets.AZURE_OIDC_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID || secrets.AZURE_OIDC_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID || secrets.AZURE_OIDC_SUBSCRIPTION_ID }}
        run: |
          missing=""
          if [ -z "$AZURE_CLIENT_ID" ]; then missing="$missing AZURE_CLIENT_ID"; fi
          if [ -z "$AZURE_TENANT_ID" ]; then missing="$missing AZURE_TENANT_ID"; fi
          if [ -z "$AZURE_SUBSCRIPTION_ID" ]; then missing="$missing AZURE_SUBSCRIPTION_ID"; fi
          if [ -n "$missing" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Missing OIDC identifier(s):$missing — skipping deployment. Run scripts/bootstrap/azure-oidc-setup.sh and set the three AZURE_* repo variables it prints."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Azure Login (OIDC)
        if: steps.creds.outputs.configured == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID || secrets.AZURE_OIDC_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID || secrets.AZURE_OIDC_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID || secrets.AZURE_OIDC_SUBSCRIPTION_ID }}
          audience: api://AzureADTokenExchange

      - name: Prepare custody metadata
        id: custody
        if: steps.creds.outputs.configured == 'true'
        run: |
          set -euo pipefail
          mkdir -p custody
          template_digest="$(sha256sum infra/main.bicep | awk '{print $1}')"
          parameters_digest="$(sha256sum infra/main.bicepparam | awk '{print $1}')"
          jq -n \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg commit "$GITHUB_SHA" \
            --arg ref "$GITHUB_REF" \
            --arg actor "$GITHUB_ACTOR" \
            --arg event "$GITHUB_EVENT_NAME" \
            --arg resourceGroup "$AZURE_RESOURCE_GROUP" \
            --arg oidcAudience "api://AzureADTokenExchange" \
            --arg templateDigest "$template_digest" \
            --arg parametersDigest "$parameters_digest" \
            '{runId:$runId, runAttempt:$runAttempt, commit:$commit, ref:$ref, actor:$actor, event:$event, resourceGroup:$resourceGroup, oidcAudience:$oidcAudience, templateDigestSha256:$templateDigest, parametersDigestSha256:$parametersDigest}' \
            > custody/manifest-inputs.json

      - name: Ensure resource group for deploy
        if: steps.creds.outputs.configured == 'true' && github.event_name == 'push'
        run: |
          if [ "$(az group exists --name "$AZURE_RESOURCE_GROUP")" != "true" ]; then
            az group create -n "$AZURE_RESOURCE_GROUP" -l "$AZURE_LOCATION"
          fi

      - name: Verify what-if resource group exists
        if: steps.creds.outputs.configured == 'true' && github.event_name == 'workflow_dispatch' && inputs.what_if
        run: |
          set -euo pipefail
          deployment_name="helios-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          record="custody/record-what-if-precheck-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          stdout_file="$(mktemp)"
          stderr_file="$(mktemp)"
          trap 'rm -f "$stdout_file" "$stderr_file"' EXIT
          if [ "$(az group exists --name "$AZURE_RESOURCE_GROUP")" != "true" ]; then
            printf '%s\n' "ERROR: What-if is read-only and will not create missing resource group '$AZURE_RESOURCE_GROUP'. Create it first or run deploy mode." > "$stderr_file"
            python3 scripts/validation/emit_deploy_custody_record.py \
              --phase what-if-precheck \
              --deployment-name "$deployment_name" \
              --timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --exit-code 1 \
              --stdout-file "$stdout_file" \
              --stderr-file "$stderr_file" \
              --record-file "$record"
            cat "$stderr_file" >&2
            exit 1
          fi

      - name: What-if (sanitized custody record)
        id: whatif
        if: steps.creds.outputs.configured == 'true' && github.event_name == 'workflow_dispatch' && inputs.what_if
        run: |
          set -euo pipefail
          deployment_name="helios-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          record="custody/record-what-if-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          stdout_file="$(mktemp)"
          stderr_file="$(mktemp)"
          trap 'rm -f "$stdout_file" "$stderr_file"' EXIT
          set +e
          az deployment group what-if \
            -g "$AZURE_RESOURCE_GROUP" \
            --name "$deployment_name" \
            --template-file infra/main.bicep \
            --parameters infra/main.bicepparam \
            --result-format ResourceIdOnly \
            --no-pretty-print \
            --output json > "$stdout_file" 2>"$stderr_file"
          rc=$?
          set -e
          create_count=0
          modify_count=0
          delete_count=0
          if [ "$rc" -eq 0 ]; then
            create_count="$(jq '[.changes[]? | select(.changeType=="Create")] | length' "$stdout_file")"
            modify_count="$(jq '[.changes[]? | select(.changeType=="Modify")] | length' "$stdout_file")"
            delete_count="$(jq '[.changes[]? | select(.changeType=="Delete")] | length' "$stdout_file")"
          fi
          python3 scripts/validation/emit_deploy_custody_record.py \
            --phase what-if \
            --deployment-name "$deployment_name" \
            --timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --exit-code "$rc" \
            --stdout-file "$stdout_file" \
            --stderr-file "$stderr_file" \
            --record-file "$record"
          if [ "$rc" -ne 0 ]; then
            echo "::error::Azure what-if failed (exit $rc). See sanitized custody artifact for diagnostics."
            exit "$rc"
          fi

      - name: Deploy Helios Infra (sanitized custody record)
        id: deploy
        if: steps.creds.outputs.configured == 'true' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.what_if))
        run: |
          set -euo pipefail
          deployment_name="helios-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          record="custody/record-deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          stdout_file="$(mktemp)"
          stderr_file="$(mktemp)"
          trap 'rm -f "$stdout_file" "$stderr_file"' EXIT
          set +e
          az deployment group create \
            -g "$AZURE_RESOURCE_GROUP" \
            --name "$deployment_name" \
            --template-file infra/main.bicep \
            --parameters infra/main.bicepparam \
            --query '{name:name, id:id, resourceGroup:resourceGroup, provisioningState:properties.provisioningState, timestamp:properties.timestamp}' \
            --output json > "$stdout_file" 2>"$stderr_file"
          rc=$?
          set -e
          python3 scripts/validation/emit_deploy_custody_record.py \
            --phase deploy \
            --deployment-name "$deployment_name" \
            --timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --exit-code "$rc" \
            --stdout-file "$stdout_file" \
            --stderr-file "$stderr_file" \
            --record-file "$record"
          if [ "$rc" -ne 0 ]; then
            echo "::error::Azure deployment failed (exit $rc). See sanitized custody artifact for diagnostics."
            exit "$rc"
          fi

      - name: Seal custody manifest
        id: seal
        if: always() && steps.creds.outputs.configured == 'true' && steps.custody.conclusion == 'success'
        run: |
          set -euo pipefail
          cd custody
          mode="deploy"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "${{ inputs.what_if }}" = "true" ]; then mode="what-if"; fi
          jq -n \
            --slurpfile inputs manifest-inputs.json \
            --arg mode "$mode" \
            --arg whatIfOutcome "${{ steps.whatif.outcome }}" \
            --arg deployOutcome "${{ steps.deploy.outcome }}" \
            --arg sealedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{inputs:$inputs[0], mode:$mode, outcomes:{whatIf:$whatIfOutcome, deploy:$deployOutcome}, sealedAt:$sealedAt}' > manifest.json
          shopt -s nullglob
          records=(record-*.json)
          if [ "${#records[@]}" -eq 0 ]; then
            echo "::warning::No record-*.json files were produced; sealing manifest-only diagnostics."
            sha256sum manifest-inputs.json manifest.json > checksums.sha256
          else
            sha256sum manifest-inputs.json manifest.json "${records[@]}" > checksums.sha256
          fi
          sha256sum checksums.sha256 > checksums.sha256.sha256
          {
            echo "## Deploy custody ($mode)"
            echo "This checksum set is tamper-evident integrity data for retained artifacts; it is not a substitute for GitHub/Azure authenticated provenance."
            echo '```'
            cat manifest.json
            echo
            cat checksums.sha256
            echo
            cat checksums.sha256.sha256
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plan/deploy custody
        if: always() && steps.creds.outputs.configured == 'true' && steps.seal.conclusion != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: helios-deploy-custody-${{ github.run_id }}-${{ github.run_attempt }}
          path: custody/
          retention-days: 90
          if-no-files-found: error
