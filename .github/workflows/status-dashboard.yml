# Real workflow-health dashboard.
#
# Replaces the former hardcoded version, which published invented success rates and
# 2024 timestamps for workflows that do not exist and committed them to the repo with
# contents:write. This version computes everything from the Actions REST API at run
# time, writes NOTHING to the repo, and publishes a single `dashboard.json` artifact.
# pages-dashboard.yml consumes that artifact (via workflow_run) and deploys it to
# GitHub Pages together with .github/pages/index.html.
name: Status Dashboard

on:
  schedule:
    - cron: '23 * * * *' # hourly, off the :00 load spike; cron is always UTC
  workflow_dispatch:

# Read-only by design: actions:read to query run history, contents:read baseline.
# The old contents:write is deliberately gone — this workflow never commits.
permissions:
  contents: read
  actions: read

concurrency:
  group: status-dashboard
  # Queue instead of cancel: a cancelled run would fire workflow_run with
  # conclusion != success and Pages would (correctly) skip that cycle.
  cancel-in-progress: false

jobs:
  collect-real-status:
    name: Collect real workflow status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No checkout: everything comes from the REST API via the preinstalled gh CLI.
      - name: Fetch workflows and recent runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # One page each keeps runtime in seconds; the success-rate window is
          # therefore "the 100 most recent runs across all workflows", stated as such.
          gh api "/repos/${REPO}/actions/workflows?per_page=100" > workflows.json
          gh api "/repos/${REPO}/actions/runs?per_page=100" > runs.json

      - name: Compute per-workflow health (dashboard.json)
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Defensive jq: every field falls back (// null, // []) because in-progress
          # runs have conclusion=null and brand-new workflows have no runs at all.
          jq -n \
            --slurpfile wfs workflows.json \
            --slurpfile rs runs.json \
            --arg generated_at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --arg repo "${REPO}" \
            '
            ($wfs[0].workflows // []) as $workflows
            | ($rs[0].workflow_runs // []) as $all
            | {
                generated_at: $generated_at,
                repository: $repo,
                runs_sampled: ($all | length),
                source: "GitHub Actions REST API; success rate covers only the sampled window",
                workflows:
                  [ $workflows[]
                    | . as $w
                    | [ $all[] | select(.workflow_id == $w.id) ] as $mine
                    | [ $mine[] | select(.status == "completed") ] as $done
                    | [ $done[] | select(.conclusion == "success") ] as $ok
                    | {
                        name: ($w.name // "(unnamed)"),
                        path: ($w.path // null),
                        state: ($w.state // "unknown"),
                        latest_status: ($mine[0].status // null),
                        latest_conclusion: ($mine[0].conclusion // null),
                        last_run_at: ($mine[0].run_started_at // $mine[0].created_at // null),
                        runs_in_window: ($mine | length),
                        completed_in_window: ($done | length),
                        success_rate_pct:
                          (if ($done | length) > 0
                           then ((($ok | length) * 1000.0 / ($done | length)) | round / 10)
                           else null end),
                        html_url: ($w.html_url // null)
                      }
                  ] | sort_by(.name)
              }
            ' > dashboard.json
          jq -e '.generated_at and (.workflows | type == "array")' dashboard.json > /dev/null

      - name: Write step summary
        run: |
          set -euo pipefail
          {
            echo "## Workflow health (real data)"
            echo ""
            jq -r '"_Generated \(.generated_at) for `\(.repository)` from the \(.runs_sampled) most recent runs. Success rate covers only that window._"' dashboard.json
            echo ""
            jq -r '(.workflows | length) as $total
                   | ([.workflows[] | select(.latest_conclusion == "success")] | length) as $green
                   | "**\($green) of \($total)** workflows are green on their latest run."' dashboard.json
            echo ""
            echo "| Workflow | State | Latest | Success rate (window) | Completed/seen | Last run (UTC) |"
            echo "|---|---|---|---|---|---|"
            jq -r '
              .workflows[]
              | "| \(.name | gsub("\\|"; "\\|")) | \(.state) | \(.latest_conclusion // .latest_status // "no recent runs") | \(if .success_rate_pct == null then "—" else "\(.success_rate_pct)%" end) | \(.completed_in_window)/\(.runs_in_window) | \(.last_run_at // "—") |"
            ' dashboard.json
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload dashboard.json artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: dashboard.json
          retention-days: 7 # regenerated hourly; keep storage small
          if-no-files-found: error
