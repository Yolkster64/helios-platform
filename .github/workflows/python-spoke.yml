name: Python Spoke

on:
  pull_request:
    paths:
      - 'src/ai/python/**'
      - '.github/workflows/python-spoke.yml'
  push:
    branches: [main]
    paths:
      - 'src/ai/python/**'

permissions:
  contents: read

jobs:
  test:
    name: pytest (${{ matrix.extras }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # bare = the dependency-free path every box gets; ml = numpy + scikit-learn backends
        extras: [bare, ml]
    defaults:
      run:
        working-directory: src/ai/python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          python -m pip install pytest
          if [ "${{ matrix.extras }}" = "ml" ]; then
            python -m pip install '.[ml]'
          else
            python -m pip install .
          fi

      - name: Run tests
        run: python -m pytest tests -q

      - name: Smoke-test installed package outside source tree
        run: |
          helios_smoke_dir="$(mktemp -d)"
          cd "$helios_smoke_dir"
          printf '%s' '{"op":"engine_catalog"}' | python -m helios_agents > response.json
          python -c 'import json; result=json.load(open("response.json", encoding="utf-8")); assert result["ok"] and result["result"]["implemented_count"] > 0'
