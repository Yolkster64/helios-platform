name: Python Spoke

on:
  pull_request:
    paths:
      - 'src/ai/python/**'
      - 'scripts/**/*.py'
      - '.github/workflows/python-spoke.yml'
  push:
    branches: [main]
    paths:
      - 'src/ai/python/**'
      - 'scripts/**/*.py'

permissions:
  contents: read

jobs:
  test:
    name: pytest (${{ matrix.extras }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # bare = the dependency-free path every box gets; ml = numpy + scikit-learn backends
        extras: [bare, ml]
    defaults:
      run:
        working-directory: src/ai/python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Fast, dependency-free syntax gate: byte-compiles the spoke and any Python
      # under scripts/ before the heavier install+pytest steps. compileall exits
      # non-zero on the first file that fails to parse.
      - name: Python compile check
        working-directory: ${{ github.workspace }}
        run: python3 -m compileall -q src/ai/python scripts

      - name: Install test dependencies
        run: |
          python -m pip install pytest
          if [ "${{ matrix.extras }}" = "ml" ]; then
            python -m pip install '.[ml]'
          else
            python -m pip install .
          fi

      - name: Run tests
        run: python -m pytest tests -q

      - name: Smoke-test installed package outside source tree
        run: |
          helios_smoke_dir="$(mktemp -d)"
          cd "$helios_smoke_dir"
          printf '%s' '{"op":"engine_catalog"}' | python -m helios_agents > response.json
          python -c 'import json; result=json.load(open("response.json", encoding="utf-8")); assert result["ok"] and result["result"]["implemented_count"] > 0'

  typecheck:
    name: pyright (helios_agents)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/ai/python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Type-check the spoke package only (src/ai/python/pyrightconfig.json:
      # include helios_agents, standard mode, pythonVersion 3.10 = the package's
      # requires-python floor). The ml extras are installed so the optional
      # numpy/scikit-learn imports resolve instead of reading as missing
      # modules; the bare path is still exercised by the pytest matrix above.
      # Blocking: the package is clean at this pin, so any new finding fails
      # the job. The tests/ tree is deliberately outside the include — it is
      # loosely typed by design and stays covered by pytest.
      - name: Install package and pyright
        run: |
          python -m pip install '.[ml]'
          python -m pip install pyright==1.1.405

      - name: Run pyright
        run: python -m pyright
