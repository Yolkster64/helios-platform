name: Python Spoke

on:
  pull_request:
    paths:
      - 'src/ai/python/**'
      - '.github/workflows/python-spoke.yml'
  push:
    branches: [main]
    paths:
      - 'src/ai/python/**'

permissions:
  contents: read

jobs:
  test:
    name: pytest (${{ matrix.extras }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # bare = the dependency-free path every box gets; ml = numpy + scikit-learn backends
        extras: [bare, ml]
    defaults:
      run:
        working-directory: src/ai/python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          python -m pip install pytest
          if [ "${{ matrix.extras }}" = "ml" ]; then
            python -m pip install '.[ml]'
          fi

      - name: Run tests
        run: python -m pytest tests -q
