name: AI Code Review Pipeline

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# The default GITHUB_TOKEN is read-only here; the review-comment job needs
# write access or its createComment call 403s.
permissions:
  contents: read

jobs:
  ai-security-review:
    runs-on: ubuntu-latest
    name: ChatGPT Security Review
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PowerShell
        shell: pwsh -Command "& '{0}'"
        run: |
          Write-Host "PowerShell version: $($PSVersionTable.PSVersion)"

      - name: Check for AI-Generated Code
        shell: pwsh -Command "& '{0}'"
        run: |
          $aiFiles = Get-ChildItem -Recurse -Filter "*.ps1" | `
            Where-Object { $_.Name -match "generated|codex" } | `
            Select-Object -ExpandProperty FullName
          
          if ($aiFiles) {
            Write-Host "AI-Generated files detected: $($aiFiles.Count)"
            foreach ($file in $aiFiles) {
              Write-Host "  - $file"
            }
            Write-Host "::notice::AI-Generated code detected. Flagging for review."
          }

      - name: Scan for Credential Exposure
        shell: pwsh -Command "& '{0}'"
        run: |
          $credentials = @("password", "api.?key", "secret", "token", "credential")
          $files = Get-ChildItem -Recurse -Include "*.ps1", "*.py", "*.js" | 
            Where-Object { $_.Name -notmatch "test|example" }
          
          $found = $false
          foreach ($file in $files) {
            $content = Get-Content $file -Raw
            foreach ($pattern in $credentials) {
              if ($content -match $pattern) {
                Write-Host "::warning::Potential credential in $($file.Name): matches '$pattern'"
                $found = $true
              }
            }
          }
          
          if ($found) {
            Write-Host "::notice::Credential scan found heuristic matches. Review warnings above; not failing on keywords alone."
          }

      - name: Check Security Issues
        shell: pwsh -Command "& '{0}'"
        run: |
          $dangerPatterns = @(
            "cmd\.exe",
            "powershell.*-nop",
            "bypass",
            "Remove-Item.*recurse",
            "del.*\/s"
          )
          
          $files = Get-ChildItem -Recurse -Include "*.ps1"
          $issues = 0
          
          foreach ($file in $files) {
            $content = Get-Content $file -Raw
            foreach ($pattern in $dangerPatterns) {
              if ($content -match $pattern) {
                Write-Host "::warning::Potential security issue in $($file.Name)"
                $issues++
              }
            }
          }
          
          if ($issues -gt 0) {
            Write-Host "::warning::Found $issues potential security issues"
          }

  ai-codex-suggestions:
    runs-on: ubuntu-latest
    name: Codex Suggestions
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Changed Files
        shell: pwsh -Command "& '{0}'"
        run: |
          if ('${{ github.event_name }}' -eq 'pull_request') {
            $base = '${{ github.event.pull_request.base.sha }}'
            $head = '${{ github.event.pull_request.head.sha }}'
            git diff --name-only "${base}...${head}" | Tee-Object -Variable changedFiles
          } elseif ('${{ github.event_name }}' -eq 'push') {
            $before = '${{ github.event.before }}'
            $after = '${{ github.sha }}'
            if ($before -match '^0+$') {
              git diff-tree --no-commit-id --name-only -r $after | Tee-Object -Variable changedFiles
            } else {
              git diff --name-only $before $after | Tee-Object -Variable changedFiles
            }
          } else {
            git diff --name-only HEAD~1 HEAD | Tee-Object -Variable changedFiles
          }
          Write-Host "Changed files:"
          foreach ($file in $changedFiles) {
            Write-Host "  - $file"
          }

      - name: Check for Refactoring Opportunities
        shell: pwsh -Command "& '{0}'"
        run: |
          $files = Get-ChildItem -Include "*.ps1" -Recurse | 
            Where-Object { $_.Length -gt 500 }
          
          Write-Host "::notice::Analyzing $(($files | Measure-Object).Count) files for optimization"
          
          foreach ($file in $files) {
            $lines = (Get-Content $file | Measure-Object -Line).Lines
            if ($lines -gt 200) {
              Write-Host "::notice::File $($file.Name) has $lines lines - consider breaking into functions"
            }
          }

  code-quality-check:
    runs-on: ubuntu-latest
    name: Code Quality Checks
    
    steps:
      - uses: actions/checkout@v4

      - name: Check PowerShell Syntax
        shell: pwsh -Command "& '{0}'"
        run: |
          $errors = 0
          $files = Get-ChildItem -Recurse -Include "*.ps1"
          
          foreach ($file in $files) {
            $parseErrors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName,
              [ref]$null,
              [ref]$parseErrors
            )
            if ($parseErrors.Count -gt 0) {
              foreach ($parseError in $parseErrors) {
                Write-Host "::error::Syntax error in $($file.Name): $($parseError.Message)"
              }
              $errors++
            }
          }
          
          if ($errors -gt 0) {
            exit 1
          }

      - name: Verify Documentation
        shell: pwsh -Command "& '{0}'"
        run: |
          $files = Get-ChildItem -Recurse -Include "*.ps1" | 
            Where-Object { $_.Name -notmatch "test" }
          
          foreach ($file in $files) {
            $content = Get-Content $file -Raw
            if ($content -notmatch "\.SYNOPSIS|\.DESCRIPTION") {
              Write-Host "::warning::$($file.Name) lacks proper documentation"
            }
          }

  flag-ai-code-for-review:
    runs-on: ubuntu-latest
    name: Flag AI-Generated Code
    if: always()
    
    steps:
      - uses: actions/checkout@v4

      - name: Identify AI-Generated Files
        shell: pwsh -Command "& '{0}'"
        run: |
          $aiFiles = Get-ChildItem -Recurse -Include "*.ps1", "*.py" | 
            Where-Object {
              $content = Get-Content $_ -Raw
              $content -match "AI-Generated|Codex|ChatGPT" -or `
              $content -match "Source:\s*(GitHub Codex|ChatGPT)"
            }
          
          if ($aiFiles) {
            Write-Host "::notice::AI-Generated files require review:`n$($aiFiles.FullName -join "`n")"
            
            # Create review checklist
            Write-Host "`n✓ Review Checklist for AI-Generated Code:"
            Write-Host "  [ ] Security review passed"
            Write-Host "  [ ] Performance acceptable"
            Write-Host "  [ ] Compliance verified"
            Write-Host "  [ ] Tests added"
            Write-Host "  [ ] Documentation complete"
            
            # This would trigger a required review
            Write-Host "::warning::AI-generated code markers detected. Manual review is recommended."
          }

  approval-gate:
    runs-on: ubuntu-latest
    name: Approval Gate
    needs: [ai-security-review, code-quality-check]
    if: always()
    
    steps:
      - name: Check Approval Status
        run: |
          echo "AI review pipeline complete"
          echo "Status summary:"
          echo "  - Security Review: ${{ needs.ai-security-review.result }}"
          echo "  - Code Quality: ${{ needs.code-quality-check.result }}"
          
          if [ "${{ needs.ai-security-review.result }}" != "success" ]; then
            echo "::error::Security review failed"
            exit 1
          fi
          
          if [ "${{ needs.code-quality-check.result }}" != "success" ]; then
            echo "::error::Code quality checks failed"
            exit 1
          fi

  comment-on-pr:
    runs-on: ubuntu-latest
    name: Add Review Comments
    # Waits for the gate jobs and reports their REAL results — a static "all
    # verified" comment posted in parallel with the gates was misleading whenever
    # a gate later failed.
    needs: [ai-security-review, code-quality-check, approval-gate]
    if: ${{ always() && github.event_name == 'pull_request' }}
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Fork PR notice
        if: ${{ github.event.pull_request.head.repo.fork }}
        run: echo "::notice::Skipping PR comment update for forked pull requests because write-scoped comment APIs are restricted."

      - name: Generate Review Comment
        if: ${{ !github.event.pull_request.head.repo.fork }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const mark = r => r === 'success' ? '✅' : r === 'skipped' ? '⏭️' : '❌';
            const security = '${{ needs.ai-security-review.result }}';
            const quality = '${{ needs.code-quality-check.result }}';
            const gate = '${{ needs.approval-gate.result }}';
            const allGreen = [security, quality, gate].every(r => r === 'success');
            const marker = '<!-- helios-ai-code-review -->';
            const comment = `${marker}
            ## 🤖 AI Integration Pipeline Results

            **Pipeline Status**: ${allGreen ? '✅ Complete' : '⚠️ Attention needed'}

            ### Analysis Summary
            - ${mark(security)} Security scan: ${security}
            - ${mark(quality)} Code quality: ${quality}
            - ${mark(gate)} Approval gate: ${gate}
            
            ### Recommendations
            For any AI-generated code detected:
            1. Review security implications
            2. Validate performance impact
            3. Check compliance requirements
            4. Verify test coverage
            
            **Next Steps**: 
            - Review code changes above
            - Approve if all checks pass
            - Request changes if issues found
            
            [AI Integration Docs](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/ai-integration/README.md)
            `;

            const existing = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100
            });
            const prior = existing.find(c => c.user?.login === 'github-actions[bot]' && c.body?.includes(marker));
            if (prior) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: prior.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }
            
            return;
