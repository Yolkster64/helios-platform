name: Infra Validation

on:
  # No paths filter on pull_request (deliberate — required-check contract): the
  # bicep-validate / arm-freshness / terraform-validate contexts are
  # ruleset-required status checks, and a required check that never reports blocks
  # that PR's merge forever. The workflow triggers on every PR; the `changes` job
  # skips the heavy jobs on non-infra diffs — GitHub treats skipped required
  # checks as satisfied.
  pull_request:
  push:
    branches: [main]
    paths: ['infra/**']

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      relevant: ${{ steps.diff.outputs.relevant }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect infra changes
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # --no-renames (review finding): default rename detection emits only the
          # DESTINATION path, so renaming infra/main.bicep out of infra/ would read
          # as irrelevant and skip all three required infra checks. With
          # --no-renames a rename is a delete+add and both sides are matched.
          # -z (review finding): the default output C-quotes pathnames that carry
          # non-ASCII or special characters ("infra/r\303\251gion.bicep"), so the
          # anchored pattern below would miss them and skip the required infra checks.
          # NUL-terminated output is never quoted; tr turns it back into one path per line.
          # NUL records all the way (review finding): a pathname may itself contain a
          # newline, so turning the -z stream back into lines would split such a path
          # and match (or miss) its fragments instead of the path. mapfile -d '' reads
          # one NUL-terminated record per element; each record is matched whole, and
          # the listing is printed with %q so an embedded newline stays visible.
          # The diff's exit status is checked (review finding): a git failure inside a
          # process substitution is invisible to mapfile, which would then classify an
          # EMPTY list as "not relevant" and skip the required job — so the diff lands
          # in a file first and a failure fails this step loudly instead.
          diff_file="$(mktemp)"
          if ! git diff --no-renames --name-only -z "$BASE_SHA" "$HEAD_SHA" > "$diff_file"; then
            echo "::error::git diff $BASE_SHA..$HEAD_SHA failed — the PR cannot be classified, failing instead of skipping the required checks"
            rm -f "$diff_file"
            exit 1
          fi
          mapfile -d '' changed < "$diff_file"
          rm -f "$diff_file"
          printf '%q\n' "${changed[@]}"
          # The workflow file itself is a relevant path (review finding): a PR that
          # changes only this validator would otherwise skip all three required infra
          # jobs, so a broken validator change would never be exercised before merge
          # (the .NET detector includes its own workflow the same way).
          # Whole-record match in the shell (review findings): no pipeline, so no
          # SIGPIPE'd producer can flip the verdict under the runner's pipefail shell,
          # and [[ =~ ]] anchors ^ and $ at the ends of the whole path, never at an
          # embedded newline.
          pattern='^(infra/|\.github/workflows/infra-validate\.yml$)'
          relevant=false
          for path in "${changed[@]}"; do
            if [[ "$path" =~ $pattern ]]; then relevant=true; break; fi
          done
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"

  bicep-validate:
    runs-on: ubuntu-latest
    needs: [changes]
    if: always() && (github.event_name != 'pull_request' || needs.changes.result != 'cancelled')
    steps:
      - name: Decide whether Bicep validation is applicable
        id: gate
        run: |
          should_run=true
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ needs.changes.result }}" = "success" ] && [ "${{ needs.changes.outputs.relevant }}" = "false" ]; then
            should_run=false
          elif [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ needs.changes.result }}" != "success" ]; then
            echo "::warning::changes job did not succeed; running Bicep validation instead of treating it as not-applicable."
          fi
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"

      - name: Not applicable (no infra changes in this PR)
        if: steps.gate.outputs.should_run != 'true'
        run: echo "Skipping Bicep validation because this PR has no infra changes."

      - name: Checkout
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/checkout@v4

      # az bicep runs entirely offline — no login or subscription needed,
      # so this job is deterministic on forks and PRs.
      - name: Bicep build (compile + lint)
        if: steps.gate.outputs.should_run == 'true'
        run: |
          az bicep install
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep build-params --file infra/main.bicepparam --stdout > /dev/null

  # infra/arm/main.json is a GENERATED mirror of infra/main.bicep (see infra/arm/README.md).
  # This gate recompiles the Bicep and fails if the committed JSON has drifted. The
  # comparison is canonical JSON (json.load == json.load), so trailing newlines and
  # formatting are irrelevant; metadata._generator (Bicep CLI version + templateHash)
  # is stripped first so a toolchain version bump alone never turns the gate red.
  arm-freshness:
    runs-on: ubuntu-latest
    needs: [changes]
    if: always() && (github.event_name != 'pull_request' || needs.changes.result != 'cancelled')
    steps:
      - name: Decide whether ARM freshness is applicable
        id: gate
        run: |
          should_run=true
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ needs.changes.result }}" = "success" ] && [ "${{ needs.changes.outputs.relevant }}" = "false" ]; then
            should_run=false
          elif [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ needs.changes.result }}" != "success" ]; then
            echo "::warning::changes job did not succeed; running ARM freshness validation instead of treating it as not-applicable."
          fi
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"

      - name: Not applicable (no infra changes in this PR)
        if: steps.gate.outputs.should_run != 'true'
        run: echo "Skipping ARM freshness because this PR has no infra changes."

      - name: Checkout
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Regenerate ARM template from Bicep
        if: steps.gate.outputs.should_run == 'true'
        run: |
          az bicep install
          az bicep build --file infra/main.bicep --outfile /tmp/main.generated.json

      - name: Compare against committed infra/arm/main.json
        if: steps.gate.outputs.should_run == 'true'
        run: |
          python3 - <<'EOF'
          import json, sys

          def strip_generator(node):
              """Recursively drop metadata._generator (root and nested module
              templates): it carries the Bicep CLI version and templateHash,
              which change with the toolchain, not the template content."""
              if isinstance(node, dict):
                  meta = node.get("metadata")
                  if isinstance(meta, dict):
                      meta.pop("_generator", None)
                      if not meta:
                          del node["metadata"]
                  for value in node.values():
                      strip_generator(value)
              elif isinstance(node, list):
                  for value in node:
                      strip_generator(value)

          with open("/tmp/main.generated.json") as f:
              generated = json.load(f)
          with open("infra/arm/main.json") as f:
              committed = json.load(f)
          strip_generator(generated)
          strip_generator(committed)

          if generated != committed:
              print("::error file=infra/arm/main.json::infra/arm/main.json is stale — it no longer matches what infra/main.bicep compiles to. Regenerate it and commit the result: bicep build infra/main.bicep --outfile infra/arm/main.json")
              print("FAIL: committed ARM template differs from the current Bicep output.")
              print("Fix: bicep build infra/main.bicep --outfile infra/arm/main.json  (then commit)")
              sys.exit(1)
          print("OK: infra/arm/main.json matches infra/main.bicep (canonical JSON comparison).")
          EOF

  # Validate-only: fmt/init/validate need no backend, no providers configured with
  # credentials, and no cloud access — deterministic on forks and PRs, just like the
  # Bicep job. infra/terraform is an independent mirror of the stack (see infra/README.md).
  terraform-validate:
    runs-on: ubuntu-latest
    needs: [changes]
    if: always() && (github.event_name != 'pull_request' || needs.changes.result != 'cancelled')
    steps:
      - name: Decide whether Terraform validation is applicable
        id: gate
        run: |
          should_run=true
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ needs.changes.result }}" = "success" ] && [ "${{ needs.changes.outputs.relevant }}" = "false" ]; then
            should_run=false
          elif [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ needs.changes.result }}" != "success" ]; then
            echo "::warning::changes job did not succeed; running Terraform validation instead of treating it as not-applicable."
          fi
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"

      - name: Not applicable (no infra changes in this PR)
        if: steps.gate.outputs.should_run != 'true'
        run: echo "Skipping Terraform validation because this PR has no infra changes."

      - name: Checkout
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Setup Terraform
        if: steps.gate.outputs.should_run == 'true'
        uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt
        if: steps.gate.outputs.should_run == 'true'
        run: terraform -chdir=infra/terraform fmt -check -recursive

      - name: Terraform init (no backend)
        if: steps.gate.outputs.should_run == 'true'
        run: terraform -chdir=infra/terraform init -backend=false

      - name: Terraform validate
        if: steps.gate.outputs.should_run == 'true'
        run: terraform -chdir=infra/terraform validate
