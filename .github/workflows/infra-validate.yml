name: Infra Validation

on:
  # No paths filter on pull_request (deliberate — required-check contract): the
  # bicep-validate / arm-freshness / terraform-validate contexts are
  # ruleset-required status checks, and a required check that never reports blocks
  # that PR's merge forever. The workflow triggers on every PR; the `changes` job
  # skips the heavy jobs on non-infra diffs — GitHub treats skipped required
  # checks as satisfied.
  pull_request:
  push:
    branches: [main]
    paths: ['infra/**']

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      relevant: ${{ steps.diff.outputs.relevant }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect infra changes
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # --no-renames (review finding): default rename detection emits only the
          # DESTINATION path, so renaming infra/main.bicep out of infra/ would read
          # as irrelevant and skip all three required infra checks. With
          # --no-renames a rename is a delete+add and both sides are matched.
          changed="$(git diff --no-renames --name-only "$BASE_SHA" "$HEAD_SHA")"
          printf '%s\n' "$changed"
          # The workflow file itself is a relevant path (review finding): a PR that
          # changes only this validator would otherwise skip all three required infra
          # jobs, so a broken validator change would never be exercised before merge
          # (the .NET detector includes its own workflow the same way).
          # Here-string, not printf|grep -q (review finding): grep -q exits at the
          # first match; under the runner's default pipefail a SIGPIPE'd printf
          # would flip this if to the false branch and skip the required checks.
          if grep -qE '^(infra/|\.github/workflows/infra-validate\.yml$)' <<< "$changed"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  bicep-validate:
    runs-on: ubuntu-latest
    needs: [changes]
    if: always() && (github.event_name != 'pull_request' || needs.changes.outputs.relevant != 'false')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # az bicep runs entirely offline — no login or subscription needed,
      # so this job is deterministic on forks and PRs.
      - name: Bicep build (compile + lint)
        run: |
          az bicep install
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep build-params --file infra/main.bicepparam --stdout > /dev/null

  # infra/arm/main.json is a GENERATED mirror of infra/main.bicep (see infra/arm/README.md).
  # This gate recompiles the Bicep and fails if the committed JSON has drifted. The
  # comparison is canonical JSON (json.load == json.load), so trailing newlines and
  # formatting are irrelevant; metadata._generator (Bicep CLI version + templateHash)
  # is stripped first so a toolchain version bump alone never turns the gate red.
  arm-freshness:
    runs-on: ubuntu-latest
    needs: [changes]
    if: always() && (github.event_name != 'pull_request' || needs.changes.outputs.relevant != 'false')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Regenerate ARM template from Bicep
        run: |
          az bicep install
          az bicep build --file infra/main.bicep --outfile /tmp/main.generated.json

      - name: Compare against committed infra/arm/main.json
        run: |
          python3 - <<'EOF'
          import json, sys

          def strip_generator(node):
              """Recursively drop metadata._generator (root and nested module
              templates): it carries the Bicep CLI version and templateHash,
              which change with the toolchain, not the template content."""
              if isinstance(node, dict):
                  meta = node.get("metadata")
                  if isinstance(meta, dict):
                      meta.pop("_generator", None)
                      if not meta:
                          del node["metadata"]
                  for value in node.values():
                      strip_generator(value)
              elif isinstance(node, list):
                  for value in node:
                      strip_generator(value)

          with open("/tmp/main.generated.json") as f:
              generated = json.load(f)
          with open("infra/arm/main.json") as f:
              committed = json.load(f)
          strip_generator(generated)
          strip_generator(committed)

          if generated != committed:
              print("::error file=infra/arm/main.json::infra/arm/main.json is stale — it no longer matches what infra/main.bicep compiles to. Regenerate it and commit the result: bicep build infra/main.bicep --outfile infra/arm/main.json")
              print("FAIL: committed ARM template differs from the current Bicep output.")
              print("Fix: bicep build infra/main.bicep --outfile infra/arm/main.json  (then commit)")
              sys.exit(1)
          print("OK: infra/arm/main.json matches infra/main.bicep (canonical JSON comparison).")
          EOF

  # Validate-only: fmt/init/validate need no backend, no providers configured with
  # credentials, and no cloud access — deterministic on forks and PRs, just like the
  # Bicep job. infra/terraform is an independent mirror of the stack (see infra/README.md).
  terraform-validate:
    runs-on: ubuntu-latest
    needs: [changes]
    if: always() && (github.event_name != 'pull_request' || needs.changes.outputs.relevant != 'false')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt
        run: terraform -chdir=infra/terraform fmt -check -recursive

      - name: Terraform init (no backend)
        run: terraform -chdir=infra/terraform init -backend=false

      - name: Terraform validate
        run: terraform -chdir=infra/terraform validate
