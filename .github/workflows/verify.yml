name: Continuous Verification & Health Check

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/verify/**'
      - 'scripts/setup/setup-all.ps1'
      - '.mcp.json'
      - '.codex/config.toml'
      - '.vscode/mcp.json'
      - '.github/workflows/verify.yml'

permissions:
  contents: read

jobs:
  health-check:
    name: Check repository sources
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate current repository inputs
        run: python3 scripts/verify/repository-health.py --inventory

  verification-contract:
    name: Verification contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test MCP transport failures and repository evidence
        run: python -m unittest discover -s scripts/verify/tests -p "test_*health.py"

  generate-status-report:
    name: Generate scoped verification report
    needs: [health-check, verification-contract]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Generate from actual job results
        env:
          HELIOS_JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 scripts/verify/repository-health.py
          cat health-report/health-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-report
          path: health-report/
          if-no-files-found: error
      - name: Require successful repository checks
        run: |
          python3 -c 'import json, sys; r=json.load(open("health-report/health-report.json")); sys.exit(0 if r["repositoryChecksPassed"] else 1)'
