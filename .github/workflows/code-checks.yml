name: Code Checks - HELIOS Platform v2

on:
  push:
    branches: [main, develop]
    paths:
      - '**/*.ps1'
      - '**/*.psm1'
      - '.github/workflows/code-checks.yml'
      - 'scripts/verify/code-checks.ps1'
      - 'scripts/verify/tests/test-code-checks.ps1'
  pull_request:
    branches: [main, develop]
    paths:
      - '**/*.ps1'
      - '**/*.psm1'
      - '.github/workflows/code-checks.yml'
      - 'scripts/verify/code-checks.ps1'
      - 'scripts/verify/tests/test-code-checks.ps1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code-checks:
    name: PowerShell code checks
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pester
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $installed = Get-Module -ListAvailable Pester |
            Sort-Object Version -Descending |
            Select-Object -First 1
          if ($null -eq $installed -or $installed.Version -lt [version]'5.4.0') {
            Install-Module -Name Pester -RequiredVersion 5.4.0 -Force -Scope CurrentUser -SkipPublisherCheck
          }

      - name: Run repository PowerShell checks
        id: checks
        shell: pwsh
        env:
          HELIOS_EVENT_NAME: ${{ github.event_name }}
          HELIOS_BASE_REF: ${{ github.base_ref }}
          HELIOS_BEFORE: ${{ github.event.before }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          pwsh -NoLogo -NoProfile -File scripts/verify/code-checks.ps1 `
            -EventName $env:HELIOS_EVENT_NAME `
            -BaseRef $env:HELIOS_BASE_REF `
            -Before $env:HELIOS_BEFORE `
            -ReportPath code-checks-report.json

      - name: Run code-checks regression tests
        id: regression-tests
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          Import-Module Pester -MinimumVersion 5.4.0
          Invoke-Pester -Path scripts/verify/tests/test-code-checks.ps1 -Output Detailed -CI

      - name: Publish summary
        if: always()
        shell: pwsh
        env:
          CHECKS_OUTCOME: ${{ steps.checks.outcome }}
          TESTS_OUTCOME: ${{ steps.regression-tests.outcome }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          function Format-Outcome([string]$Outcome) {
            switch ($Outcome) {
              'success' { 'PASS' }
              'failure' { 'FAIL' }
              'skipped' { 'SKIPPED' }
              default { $Outcome.ToUpperInvariant() }
            }
          }

          $summary = @(
            '# Code checks summary'
            ''
            "- PowerShell repository checks: $(Format-Outcome $env:CHECKS_OUTCOME)"
            "- Regression tests: $(Format-Outcome $env:TESTS_OUTCOME)"
          )

          if (Test-Path -LiteralPath code-checks-report.json) {
            $report = Get-Content -LiteralPath code-checks-report.json -Raw | ConvertFrom-Json
            $summary += ''
            $summary += "Checked PowerShell files: $($report.TargetFiles.Count)"
            foreach ($check in $report.Checks) {
              $summary += "- $($check.Name): $($check.Status)"
              foreach ($message in @($check.Messages)) {
                $summary += "  - $message"
              }
            }
          }

          $summary -join [Environment]::NewLine | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
