name: Code Checks - HELIOS Platform v2

on:
  push:
    branches: [main, develop]
    paths:
      - '**.ps1'
      - '**.bat'
      - '**.cmd'
      - '.github/workflows/code-checks.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - '**.ps1'
      - '**.bat'
      - '**.cmd'

# Every step reads the checkout and prints; nothing writes back through the token.
permissions:
  contents: read

jobs:
  code-checks:
    name: Automated Code Quality Checks
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      # You cannot install the shell you are already running. This step declares
      # `shell: pwsh`, and `pwsh` is the PowerShell 6+ binary (5.1 is `powershell`), so
      # reaching the step at all proves PowerShell Core is present - the version check below
      # is what actually pins it to 7. On 2026-09-09 the hosted Windows image began shipping
      # its own PowerShell 7.6.6 through a non-chocolatey installer, so
      # `choco install powershell-core` failed outright ("already installed by another
      # mechanism and is a different version" - chocolatey compares its own package records,
      # not the running binary) and took the five substantive checks down with it, exactly as
      # the Pester install used to. A choco fallback would be unreachable anyway: were pwsh
      # missing, this step could not start. So it verifies, and says which version the rest
      # of the job will use.
      - name: Verify PowerShell 7
        shell: pwsh
        run: |
          Write-Host "PowerShell $($PSVersionTable.PSVersion) ($($PSVersionTable.PSEdition)) at $((Get-Process -Id $PID).Path)"
          if ($PSVersionTable.PSVersion.Major -lt 7) {
            throw "This job needs PowerShell 7; the runner started it under $($PSVersionTable.PSVersion)."
          }
      
      # continue-on-error: only "Run Unit Tests" below needs Pester, and a transient PSGallery
      # lookup ("No match was found ... module name 'Pester'") used to fail this step, which has
      # no continue-on-error, and take the whole job down - skipping the five substantive checks
      # after it, which need no module at all. One registry blip should not cost the syntax,
      # security, registry, path and documentation checks.
      - name: Install Pester
        id: install-pester
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Stop'
          # PSGallery is occasionally unreachable or unregistered on a fresh Windows runner;
          # one retry turns the common transient into a non-event.
          foreach ($attempt in 1..2) {
            try {
              if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
                Register-PSRepository -Default -ErrorAction Stop
              }
              Install-Module -Name Pester -RequiredVersion 5.4.0 -Force -SkipPublisherCheck -ErrorAction Stop
              Write-Host "Pester 5.4.0 installed (attempt $attempt)."
              exit 0
            }
            catch {
              Write-Host "::warning::Pester install attempt $attempt failed: $($_.Exception.Message)"
              if ($attempt -lt 2) { Start-Sleep -Seconds 10 }
            }
          }
          Write-Host "::warning::Pester could not be installed; the unit-test step will report that and the rest of this job still runs."
          exit 1
        shell: pwsh
      
      - name: PowerShell Syntax Validation
        id: syntax-check
        run: |
          Write-Host "╔════════════════════════════════════════╗"
          Write-Host "║  PowerShell Syntax Validation          ║"
          Write-Host "╚════════════════════════════════════════╝"
          
          $Files = Get-ChildItem -Recurse -Filter "*.ps1"
          $FailCount = 0
          
          foreach ($File in $Files) {
            try {
              $null = [System.Management.Automation.PSParser]::Tokenize((Get-Content $File.FullName), [ref]$null)
              Write-Host "✓ $($File.Name)"
            }
            catch {
              Write-Host "✗ $($File.Name): $($_.Exception.Message)"
              $FailCount++
            }
          }
          
          if ($FailCount -gt 0) {
            Write-Host ""
            Write-Host "❌ Syntax validation FAILED ($FailCount errors)"
            exit 1
          }
          else {
            Write-Host ""
            Write-Host "✓ All files have valid syntax"
          }
        shell: pwsh
      
      - name: Security Scanning
        id: security-scan
        run: |
          Write-Host "╔════════════════════════════════════════╗"
          Write-Host "║  Security Scanning                     ║"
          Write-Host "╚════════════════════════════════════════╝"
          
          $Files = Get-ChildItem -Recurse -Filter "*.ps1"
          $SecurityIssues = @()

          # The value must be captured and non-empty: empty parameter defaults
          # ($Password = "") and documentation placeholders (ghp_xxxxx) are not
          # leaked credentials.
          $PatternMap = @{
            'password\s*=\s*[''"]([^''\"]+)[''"]' = "Hardcoded password"
            'apikey\s*=\s*[''"]([^''\"]+)[''"]' = "Hardcoded API key"
            'secret\s*=\s*[''"]([^''\"]+)[''"]' = "Hardcoded secret"
            'token\s*=\s*[''"]([^''\"]+)[''"]' = "Hardcoded token"
          }
          $Placeholder = 'xxx|^\*+$|^<[^>]*>$|placeholder|example|changeme|dummy|your[-_]'

          foreach ($File in $Files) {
            $Raw = Get-Content $File.FullName -Raw

            if ($File.Name -notmatch '^test-' -and $Raw -notmatch '# EXAMPLE CODE') {
              foreach ($Line in (Get-Content $File.FullName)) {
                foreach ($Pattern in $PatternMap.Keys) {
                  if ($Line -match $Pattern -and $Matches[1] -notmatch $Placeholder) {
                    $SecurityIssues += @{
                      File = $File.Name
                      Issue = $PatternMap[$Pattern]
                      Pattern = $Pattern
                    }
                  }
                }
              }
            }
          }
          
          if ($SecurityIssues.Count -gt 0) {
            Write-Host "❌ Security issues found:"
            $SecurityIssues | ForEach-Object {
              Write-Host "  - [$($_.File)] $($_.Issue)"
            }
            exit 1
          }
          else {
            Write-Host "✓ No security issues detected"
          }
        shell: pwsh
      
      - name: Registry Modification Validation
        id: registry-check
        run: |
          Write-Host "╔════════════════════════════════════════╗"
          Write-Host "║  Registry Modification Validation      ║"
          Write-Host "╚════════════════════════════════════════╝"
          
          $Files = Get-ChildItem -Recurse -Filter "*.ps1"
          $IssueCount = 0
          
          foreach ($File in $Files) {
            $Content = Get-Content $File.FullName
            
            # Find registry modifications (grouped: the bare alternation matched
            # any file that merely mentioned HKCU/HKU anywhere)
            if ($Content -match '(New-Item|Set-ItemProperty|Remove-Item).*(HKLM|HKCU|HKU)') {
              # Check for documentation
              if ($Content -notmatch '# Registry:') {
                Write-Host "✗ $($File.Name): Missing '# Registry:' documentation"
                $IssueCount++
              }
              else {
                Write-Host "✓ $($File.Name): Registry changes documented"
              }
            }
          }
          
          if ($IssueCount -gt 0) {
            exit 1
          }
        shell: pwsh
      
      - name: File Path Validation
        id: path-check
        run: |
          Write-Host "╔════════════════════════════════════════╗"
          Write-Host "║  File Path Validation                  ║"
          Write-Host "╚════════════════════════════════════════╝"
          
          $Files = Get-ChildItem -Recurse -Filter "*.ps1"
          $PathIssues = @()
          
          foreach ($File in $Files) {
            $Content = Get-Content $File.FullName
            
            # Check for hardcoded paths without env variables. Single-quoted:
            # in PowerShell double-quoted strings \" does not escape the quote
            # (backtick is the escape char), so the original never parsed.
            if ($Content -match '[''"]C:\\Users\\[^''"]*[''"]' -and
                $File.Name -notmatch '^test-') {
              $PathIssues += "$($File.Name): Consider using environment variables"
            }

            # Check for invalid filename characters in quoted paths. Anchor to
            # a drive-style prefix: bare [<>:|?*] between any two quotes on a
            # line matches every quoted URL ("https://...") in the repo.
            if ($Content -match '[''"][A-Za-z]:\\[^''"]*[<>|?*][^''"]*[''"]') {
              $PathIssues += "$($File.Name): Path contains invalid characters"
            }
          }
          
          if ($PathIssues.Count -gt 0) {
            Write-Host "⚠  Path warnings:"
            $PathIssues | ForEach-Object { Write-Host "  - $_" }
          }
          else {
            Write-Host "✓ File paths are valid"
          }
        shell: pwsh
      
      - name: Documentation Check
        id: doc-check
        run: |
          Write-Host "╔════════════════════════════════════════╗"
          Write-Host "║  Documentation Requirements            ║"
          Write-Host "╚════════════════════════════════════════╝"
          
          $PhaseFiles = Get-ChildItem -Recurse -Filter "Phase-*.ps1"
          $DocIssues = 0
          
          foreach ($File in $PhaseFiles) {
            $Content = Get-Content $File.FullName
            
            $HasHeader = $Content -match '<#'
            $HasSynopsis = $Content -match '\.SYNOPSIS'
            $HasDescription = $Content -match '\.DESCRIPTION'
            
            if ($HasHeader -and $HasSynopsis -and $HasDescription) {
              Write-Host "✓ $($File.Name): Documentation complete"
            }
            else {
              Write-Host "✗ $($File.Name): Missing documentation"
              $DocIssues++
            }
          }
          
          if ($DocIssues -gt 0) {
            Write-Host ""
            Write-Host "❌ $DocIssues files missing documentation"
            exit 1
          }
        shell: pwsh
      
      - name: Test Coverage Check
        id: coverage-check
        run: |
          Write-Host "╔════════════════════════════════════════╗"
          Write-Host "║  Test Coverage Requirements            ║"
          Write-Host "╚════════════════════════════════════════╝"
          
          $TestFiles = Get-ChildItem -Recurse -Filter "test-*.ps1"
          
          if ($TestFiles.Count -eq 0) {
            Write-Host "⚠  No test files found"
          }
          else {
            Write-Host "✓ Found $($TestFiles.Count) test files"
            
            foreach ($TestFile in $TestFiles) {
              Write-Host "  - $($TestFile.Name)"
            }
          }
        shell: pwsh
      
      - name: Run Unit Tests
        id: unit-tests
        continue-on-error: true
        run: |
          Write-Host "╔════════════════════════════════════════╗"
          Write-Host "║  Running Unit Tests                    ║"
          Write-Host "╚════════════════════════════════════════╝"
          
          # The files first, then the module: this repository currently has no
          # test-*-unit.ps1 at all, so "Pester is missing" is only worth saying when there
          # was something it would have run.
          $TestFiles = Get-ChildItem -Recurse -Filter "test-*-unit.ps1"

          if ($TestFiles.Count -eq 0) {
            Write-Host "ℹ  No test-*-unit.ps1 files in this repository, so there is nothing for Pester to run."
            Write-Host "   The PowerShell suites that do run live in scripts/verify/tests/ and are"
            Write-Host "   driven by their own workflows."
            exit 0
          }

          if ('${{ steps.install-pester.outcome }}' -ne 'success') {
            Write-Host "::warning::$($TestFiles.Count) unit test file(s) were found but Pester is not installed (its install step did not succeed), so they did not run."
            exit 1
          }

          foreach ($TestFile in $TestFiles) {
            Write-Host ""
            Write-Host "Running $($TestFile.Name)..."

            $Result = Invoke-Pester -Path $TestFile.FullName -PassThru -ErrorAction SilentlyContinue

            if ($Result.FailedCount -gt 0) {
              Write-Host "❌ $($Result.FailedCount) test(s) failed"
              exit 1
            }
            else {
              Write-Host "✓ All tests passed"
            }
          }
        shell: pwsh
      
      - name: Generate Report
        if: always()
        run: |
          Write-Host ""
          Write-Host "╔════════════════════════════════════════╗"
          Write-Host "║  Code Checks Summary                   ║"
          Write-Host "╚════════════════════════════════════════╝"
          Write-Host ""
          # Three states, not two: a step that never ran is SKIPPED, and printing FAIL for it
          # sent a reader looking for five failures that had not happened - the real failure was
          # an earlier step, and these were skipped as its consequence.
          function Format-Outcome([string]$Outcome) {
            switch ($Outcome) {
              'success' { 'PASS' }
              'skipped' { 'SKIPPED (an earlier step failed, so this never ran)' }
              ''        { 'SKIPPED (an earlier step failed, so this never ran)' }
              default   { 'FAIL' }
            }
          }
          Write-Host "  Syntax Validation: $(Format-Outcome '${{ steps.syntax-check.outcome }}')"
          Write-Host "  Security Scanning: $(Format-Outcome '${{ steps.security-scan.outcome }}')"
          Write-Host "  Registry Check:    $(Format-Outcome '${{ steps.registry-check.outcome }}')"
          Write-Host "  Path Validation:   $(Format-Outcome '${{ steps.path-check.outcome }}')"
          Write-Host "  Documentation:     $(Format-Outcome '${{ steps.doc-check.outcome }}')"
          Write-Host "  Pester install:    $(Format-Outcome '${{ steps.install-pester.outcome }}')"
          Write-Host ""
        shell: pwsh
      
      - name: Final Status
        if: failure()
        run: |
          Write-Host ""
          Write-Host "❌ Code checks FAILED"
          Write-Host ""
          Write-Host "Please fix the issues above before committing."
          exit 1
        shell: pwsh
      
      - name: Success Message
        if: success()
        run: |
          Write-Host ""
          Write-Host "✅ All code checks PASSED"
          Write-Host ""
          Write-Host "Your code is ready to merge!"
        shell: pwsh
