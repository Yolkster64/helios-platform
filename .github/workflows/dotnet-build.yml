name: .NET Build & Test

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'config/**'
      - 'scripts/build/**'
      - '**.csproj'
      - 'HELIOS.sln'
      - 'Directory.Packages.props'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'nuget.config'
      - '.github/workflows/dotnet-build.yml'
  # No paths filter on pull_request (deliberate — required-check contract): the
  # "Build solution & run tests" context is a ruleset-required status check, and a
  # required check that never reports blocks that PR's merge forever. The workflow
  # therefore triggers on EVERY PR; the `changes` job below detects whether the
  # diff is build-relevant and SKIPS the build job when not — GitHub treats a
  # skipped required check as satisfied, so docs-only PRs merge and build-relevant
  # PRs are still gated on a real build.
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  HELIOS_REQUIRE_PYTHON_SPOKE: 1

jobs:
  # PR-only path detection for the required-check contract described in the trigger
  # comment: the pattern set below mirrors the push trigger's paths exactly.
  changes:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      relevant: ${{ steps.diff.outputs.relevant }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect build-relevant changes
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # --no-renames (review finding): default rename detection emits only the
          # DESTINATION path, so renaming a build input out of the matched paths
          # would read as irrelevant and skip the required build. With --no-renames
          # a rename is a delete+add and both sides are matched.
          changed="$(git diff --no-renames --name-only "$BASE_SHA" "$HEAD_SHA")"
          printf '%s\n' "$changed"
          pattern='^(src/|tests/|config/|scripts/build/|HELIOS\.sln$|Directory\.Packages\.props$|Directory\.Build\.props$|Directory\.Build\.targets$|nuget\.config$|\.github/workflows/dotnet-build\.yml$)|\.csproj$'
          # Here-string, not printf|grep -q (review finding): grep -q exits at the
          # first match, and under the runner's default pipefail shell a SIGPIPE'd
          # printf would flip this if to the false branch — skipping the REQUIRED
          # build on exactly the large PRs that most need it.
          if grep -qE "$pattern" <<< "$changed"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-test:
    name: Build solution & run tests
    runs-on: ubuntu-latest
    needs: [changes]
    # always() unlocks the needs edge on push/dispatch (where `changes` is skipped);
    # the comparison is != 'false' so a broken changes job fails OPEN into a real
    # build rather than silently skipping the gate.
    if: always() && (github.event_name != 'pull_request' || needs.changes.outputs.relevant != 'false')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'nuget.config') }}
          restore-keys: nuget-${{ runner.os }}-

      # Must run before dotnet build: HELIOS.AIHub.csproj copies the .so to output
      # only when it already exists, and the tests exercise the native code paths
      # (similarity dedup, token estimation) only when the library loads.
      - name: Build native library (C++ spoke)
        run: ./scripts/build/build-native.sh

      # HELIOS.sln contains only buildable projects (AIHub, CLI, MCP, tests).
      # nuget.config maps all public packages to nuget.org, so no GITHUB_TOKEN is needed.
      - name: Restore
        run: dotnet restore HELIOS.sln

      # Catalog drift (bad field name, unknown provider, empty id) would otherwise
      # surface only at runtime as a silently degraded --optimize path.
      - name: Validate model catalog
        run: python3 scripts/build/validate-model-catalog.py

      - name: Build
        id: build
        run: dotnet build HELIOS.sln -c Release --no-restore

      # The runtime degrades gracefully when the native library is missing, which is
      # right for dev machines but would let CI silently stop testing the native paths.
      # Fail loudly here instead.
      - name: Assert native library reached test output
        id: native_smoke
        run: test -f tests/HELIOS.AIHub.Tests/bin/Release/net10.0/libhelios_aihub_native.so

      - name: Test
        id: test
        run: >
          dotnet test tests/HELIOS.AIHub.Tests/HELIOS.AIHub.Tests.csproj
          -c Release --no-build
          --logger "trx;LogFileName=aihub-tests.trx"
          --results-directory ./test-results

      - name: Smoke-test cross-LLM shell
        id: cli_smoke
        run: |
          dotnet run --project src/ai/HELIOS.AIHub.Cli -c Release --no-build -- status
          dotnet run --project src/ai/HELIOS.AIHub.Cli -c Release --no-build -- routing
          dotnet run --project src/ai/HELIOS.AIHub.Cli -c Release --no-build -- engines

      - name: Upload test results
        id: upload_test_results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: warn

      - name: Publish CLI artifact
        id: publish
        run: |
          dotnet publish src/ai/HELIOS.AIHub.Cli -c Release --no-build -o ./publish/helios-ai
          # Ship the default config next to the executable so the extracted artifact
          # runs standalone — config resolution checks the app base directory too.
          mkdir -p ./publish/helios-ai/config
          cp config/aihub.json config/aihub.cloud.json config/model-catalog.json ./publish/helios-ai/config/
          mkdir -p ./publish/helios-ai/python-spoke
          cp -R src/ai/python/helios_agents ./publish/helios-ai/python-spoke/

      - name: Smoke-test extracted CLI artifact
        id: artifact_smoke
        run: |
          helios_artifact="$GITHUB_WORKSPACE/publish/helios-ai/helios-ai"
          helios_smoke_dir="$(mktemp -d)"
          cd "$helios_smoke_dir"
          "$helios_artifact" engines > catalog.json
          "$helios_artifact" engine-plan \
            --cuda=false --include-candidates=false --pressure 0 --fleet-size 0 > plan.json
          if "$helios_artifact" engines unexpected >/dev/null 2>&1; then
            echo "engines accepted an unexpected positional argument" >&2
            exit 1
          fi
          if "$helios_artifact" engine-plan --pressure >/dev/null 2>&1; then
            echo "engine-plan accepted a missing option value" >&2
            exit 1
          fi
          python3 - <<'PY'
          import json

          with open("catalog.json", encoding="utf-8") as stream:
              catalog = json.load(stream)
          with open("plan.json", encoding="utf-8") as stream:
              plan = json.load(stream)

          assert catalog["implemented_count"] > 0
          assert catalog["candidate_count"] == 0
          native_router = next(
              engine for engine in catalog["engines"]
            if engine["name"] == "online-sgd-router")
          assert native_router["runtime_available"] is True
          assert plan["inputs"]["cuda_enabled"] is False
          assert plan["inputs"]["include_candidates"] is False
          assert plan["candidate_count"] == 0
          PY

      - name: Upload CLI artifact
        id: upload_cli
        uses: actions/upload-artifact@v4
        with:
          name: helios-ai
          path: publish/helios-ai/

      # Generated LAST so the scorecard reflects every gating signal in this
      # job - a red publish/artifact-smoke can no longer leave behind a
      # healthy dashboard artifact (it runs via if: always(), so it also
      # reports on failed runs).
      - name: Generate minimal platform scorecard (informational)
        if: always()
        continue-on-error: true
        run: |
          python3 scripts/build/minimal-platform-scorecard.py \
            --trx ./test-results/aihub-tests.trx \
            --build "${{ steps.build.outcome }}" \
            --tests "${{ steps.test.outcome }}" \
            --native-smoke "${{ steps.native_smoke.outcome }}" \
            --cli-smoke "${{ steps.cli_smoke.outcome }}" \
            --publish "${{ steps.publish.outcome }}" \
            --artifact-smoke "${{ steps.artifact_smoke.outcome }}" \
            --upload-test-results "${{ steps.upload_test_results.outcome }}" \
            --upload-cli "${{ steps.upload_cli.outcome }}" \
            --out-json ./scorecard/minimal-platform-scorecard.json \
            --out-md ./scorecard/minimal-platform-scorecard.md
          cat ./scorecard/minimal-platform-scorecard.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload minimal platform scorecard
        if: always()
        # Informational artifact - a quota/transport failure here must not
        # redden an otherwise green build, same as its generator step.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: minimal-platform-scorecard
          path: scorecard/
          if-no-files-found: warn


  # The legacy core project (src/core/HELIOS.Platform) does not compile today
  # (~323 pre-existing errors). This job tracks its state in the step summary
  # without ever failing: a red X here reads as a PR problem when it is not.
  # Make the build outcome gating again once the core is repaired
  # (see ROADMAP_MULTI_LLM.md).
  legacy-core-status:
    name: Legacy core build (informational)
    runs-on: ubuntu-latest
    needs: [changes]
    # Same skip contract as build-and-test (review finding): without this gate a
    # docs-only PR still paid for a full .NET build here. Not a required check, so
    # skipping is free; always() unlocks the needs edge on push/dispatch.
    if: always() && (github.event_name != 'pull_request' || needs.changes.outputs.relevant != 'false')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build core (known broken, never fails the job)
        run: |
          dotnet build src/core/HELIOS.Platform/HELIOS.Platform.csproj -c Release 2>&1 | tee core-build.log
          if [ "${PIPESTATUS[0]}" -eq 0 ]; then
            echo "## Legacy core build: PASSED — consider making this job gating again" >> "$GITHUB_STEP_SUMMARY"
          else
            errors=$(grep -c " error " core-build.log || true)
            echo "## Legacy core build: still broken (~${errors} errors) — informational only" >> "$GITHUB_STEP_SUMMARY"
          fi

  # INFORMATIONAL ONLY — .NET 11 preview validation lane (dotnet-10-and-11.md).
  # Builds HELIOS.sln against the .NET 11 preview SDK so breakage surfaces early,
  # ahead of the GA flip. Allowed to fail: continue-on-error keeps it out of the
  # required-checks path, and nothing may ever `needs:` this job. Never gate
  # required CI on a preview SDK.
  net11-preview:
    name: .NET 11 preview build (informational, allowed to fail)
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: [changes]
    # Same skip contract as build-and-test (review finding): a docs-only PR gets no
    # preview build either. Depending ON `changes` is fine — the rule is that nothing
    # may ever `needs:` THIS job.
    if: always() && (github.event_name != 'pull_request' || needs.changes.outputs.relevant != 'false')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 11 (preview)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      # global.json pins the required lanes to the 10.0 LTS SDK; this preview
      # lane deliberately unpins so the 11 preview SDK resolves.
      - name: Unpin SDK for the preview lane
        run: rm -f global.json

      - name: Restore
        run: dotnet restore HELIOS.sln

      - name: Build (net10.0 TFMs on the .NET 11 preview SDK)
        run: |
          dotnet build HELIOS.sln -c Release --no-restore 2>&1 | tee net11-build.log
          if [ "${PIPESTATUS[0]}" -eq 0 ]; then
            echo "## .NET 11 preview build: PASSED (informational)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## .NET 11 preview build: FAILED (informational — does not gate)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
