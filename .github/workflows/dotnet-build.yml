name: .NET Build & Test

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'config/**'
      - 'scripts/build/**'
      - '**.csproj'
      - 'HELIOS.sln'
      - 'nuget.config'
      - '.github/workflows/dotnet-build.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'config/**'
      - 'scripts/build/**'
      - '**.csproj'
      - 'HELIOS.sln'
      - 'nuget.config'
      - '.github/workflows/dotnet-build.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  HELIOS_REQUIRE_PYTHON_SPOKE: 1

jobs:
  build-and-test:
    name: Build solution & run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'nuget.config') }}
          restore-keys: nuget-${{ runner.os }}-

      # Must run before dotnet build: HELIOS.AIHub.csproj copies the .so to output
      # only when it already exists, and the tests exercise the native code paths
      # (similarity dedup, token estimation) only when the library loads.
      - name: Build native library (C++ spoke)
        run: ./scripts/build/build-native.sh

      # HELIOS.sln contains only buildable projects (AIHub, CLI, MCP, tests).
      # nuget.config maps all public packages to nuget.org, so no GITHUB_TOKEN is needed.
      - name: Restore
        run: dotnet restore HELIOS.sln

      - name: Build
        run: dotnet build HELIOS.sln -c Release --no-restore

      # The runtime degrades gracefully when the native library is missing, which is
      # right for dev machines but would let CI silently stop testing the native paths.
      # Fail loudly here instead.
      - name: Assert native library reached test output
        run: test -f tests/HELIOS.AIHub.Tests/bin/Release/net8.0/libhelios_aihub_native.so

      - name: Test
        run: >
          dotnet test tests/HELIOS.AIHub.Tests/HELIOS.AIHub.Tests.csproj
          -c Release --no-build
          --logger "trx;LogFileName=aihub-tests.trx"
          --results-directory ./test-results

      - name: Smoke-test cross-LLM shell
        run: |
          dotnet run --project src/ai/HELIOS.AIHub.Cli -c Release --no-build -- status
          dotnet run --project src/ai/HELIOS.AIHub.Cli -c Release --no-build -- routing
          dotnet run --project src/ai/HELIOS.AIHub.Cli -c Release --no-build -- engines

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: warn

      - name: Publish CLI artifact
        run: |
          dotnet publish src/ai/HELIOS.AIHub.Cli -c Release --no-build -o ./publish/helios-ai
          # Ship the default config next to the executable so the extracted artifact
          # runs standalone — config resolution checks the app base directory too.
          mkdir -p ./publish/helios-ai/config
          cp config/aihub.json config/aihub.cloud.json config/model-catalog.json ./publish/helios-ai/config/
          mkdir -p ./publish/helios-ai/python-spoke
          cp -R src/ai/python/helios_agents ./publish/helios-ai/python-spoke/

      - name: Smoke-test extracted CLI artifact
        run: |
          helios_artifact="$GITHUB_WORKSPACE/publish/helios-ai/helios-ai"
          helios_smoke_dir="$(mktemp -d)"
          cd "$helios_smoke_dir"
          "$helios_artifact" engines > catalog.json
          "$helios_artifact" engine-plan \
            --cuda=false --include-candidates=false --pressure 0 --fleet-size 0 > plan.json
          if "$helios_artifact" engines unexpected >/dev/null 2>&1; then
            echo "engines accepted an unexpected positional argument" >&2
            exit 1
          fi
          if "$helios_artifact" engine-plan --pressure >/dev/null 2>&1; then
            echo "engine-plan accepted a missing option value" >&2
            exit 1
          fi
          python3 - <<'PY'
          import json

          with open("catalog.json", encoding="utf-8") as stream:
              catalog = json.load(stream)
          with open("plan.json", encoding="utf-8") as stream:
              plan = json.load(stream)

          assert catalog["implemented_count"] > 0
          assert catalog["candidate_count"] == 0
          native_router = next(
              engine for engine in catalog["engines"]
            if engine["name"] == "online-sgd-router")
          assert native_router["runtime_available"] is True
          assert plan["inputs"]["cuda_enabled"] is False
          assert plan["inputs"]["include_candidates"] is False
          assert plan["candidate_count"] == 0
          PY

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: helios-ai
          path: publish/helios-ai/

  # The legacy core project (src/core/HELIOS.Platform) does not compile today
  # (~323 pre-existing errors). This job tracks its state in the step summary
  # without ever failing: a red X here reads as a PR problem when it is not.
  # Make the build outcome gating again once the core is repaired
  # (see ROADMAP_MULTI_LLM.md).
  legacy-core-status:
    name: Legacy core build (informational)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build core (known broken, never fails the job)
        run: |
          dotnet build src/core/HELIOS.Platform/HELIOS.Platform.csproj -c Release 2>&1 | tee core-build.log
          if [ "${PIPESTATUS[0]}" -eq 0 ]; then
            echo "## Legacy core build: PASSED — consider making this job gating again" >> "$GITHUB_STEP_SUMMARY"
          else
            errors=$(grep -c " error " core-build.log || true)
            echo "## Legacy core build: still broken (~${errors} errors) — informational only" >> "$GITHUB_STEP_SUMMARY"
          fi
