name: Electron workbench

on:
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'experiments/electron-fiddle/**'
      - 'native/particle-field/**'
      - '.github/workflows/electron-workbench.yml'
  push:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - 'experiments/electron-fiddle/**'
      - 'native/particle-field/**'
      - '.github/workflows/electron-workbench.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - name: Build and test optional native particle plugin
        if: runner.os == 'Linux'
        working-directory: native/particle-field
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          npm test
      - run: npm run make
      - name: Upload unsigned application for review
        uses: actions/upload-artifact@v4
        with:
          name: helios-electron-${{ runner.os }}-${{ runner.arch }}
          path: apps/desktop/out
          if-no-files-found: error
          retention-days: 7
