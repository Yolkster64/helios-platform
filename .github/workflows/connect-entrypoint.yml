name: Shared connection entry point
on:
  pull_request:
    paths: ['connect.*', 'plugins/helios-connect/**', '.agents/plugins/marketplace.json', 'scripts/bootstrap/connect.py', 'scripts/bootstrap/workspace_agent_handoff.py', 'scripts/bootstrap/agent_workspace.py', 'scripts/verify/tests/test_connect_entrypoint.py', 'scripts/verify/tests/test_workspace_agent_handoff.py', 'scripts/verify/tests/test_agent_workspace.py', 'scripts/validation/tests/test_control_project_schema.py', 'config/**', '.codex/config.toml', '.vscode/settings.json', '.github/workflows/connect-entrypoint.yml']
  push:
    branches: [main]
    paths: ['connect.*', 'plugins/helios-connect/**', '.agents/plugins/marketplace.json', 'scripts/bootstrap/connect.py', 'scripts/bootstrap/workspace_agent_handoff.py', 'scripts/bootstrap/agent_workspace.py', 'scripts/verify/tests/test_connect_entrypoint.py', 'scripts/verify/tests/test_workspace_agent_handoff.py', 'scripts/verify/tests/test_agent_workspace.py', 'scripts/validation/tests/test_control_project_schema.py', 'config/**', '.codex/config.toml', '.vscode/settings.json', '.github/workflows/connect-entrypoint.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify shared launcher and project contracts
        run: python -m unittest scripts.verify.tests.test_connect_entrypoint scripts.validation.tests.test_control_project_schema scripts.verify.tests.test_workspace_agent_handoff scripts.verify.tests.test_agent_workspace -v
      - name: Verify portable plugin launch
        run: python -m unittest discover -s plugins/helios-connect/tests -v
      - name: Verify PowerShell wrapper
        shell: pwsh
        run: |
          $report = & ./connect.ps1 status --json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $report.authenticationProbed -ne $false) {
            throw 'Offline wrapper failed or probed authentication.'
          }
      - name: Verify Bash wrapper
        if: runner.os == 'Linux'
        run: bash connect.sh status --json | python -c 'import json,sys; assert json.load(sys.stdin)["authenticationProbed"] is False'
