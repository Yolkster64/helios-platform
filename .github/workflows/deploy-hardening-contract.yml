name: Deploy hardening contract

on:
  pull_request:
    paths:
      - '.github/workflows/helios-deploy.yml'
      - '.github/workflows/deploy-hardening-contract.yml'
      - 'scripts/validation/emit_deploy_custody_record.py'
      - 'scripts/validation/validate_deploy_custody.py'
      - 'scripts/validation/tests/test_emit_deploy_custody_record.py'
      - 'scripts/validation/tests/test_validate_deploy_custody.py'
      - 'config/github/environments.json'
      - 'config/schemas/github-environments.schema.json'
      - 'scripts/github/apply-environments.ps1'
      - 'scripts/verify/tests/test_apply_environments.ps1'
  push:
    branches: [main]
    paths:
      - '.github/workflows/helios-deploy.yml'
      - '.github/workflows/deploy-hardening-contract.yml'
      - 'scripts/validation/emit_deploy_custody_record.py'
      - 'scripts/validation/validate_deploy_custody.py'
      - 'scripts/validation/tests/test_emit_deploy_custody_record.py'
      - 'scripts/validation/tests/test_validate_deploy_custody.py'
      - 'config/github/environments.json'
      - 'config/schemas/github-environments.schema.json'
      - 'scripts/github/apply-environments.ps1'
      - 'scripts/verify/tests/test_apply_environments.ps1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install validator dependencies
        run: python3 -m pip install --disable-pip-version-check pyyaml==6.0.2

      - name: Validate deploy hardening contract
        run: python3 scripts/validation/validate_deploy_custody.py

      - name: Run deploy hardening mutation tests
        run: >-
          python3 -m unittest
          scripts.validation.tests.test_emit_deploy_custody_record
          scripts.validation.tests.test_validate_deploy_custody
          -v

      # The environment named by jobs.deploy is the gate; this is the script that puts the
      # protection rules behind that name. It runs with `gh` shimmed, so it reaches nothing.
      - name: Verify the environment-manifest apply contract
        shell: pwsh
        run: ./scripts/verify/tests/test_apply_environments.ps1
