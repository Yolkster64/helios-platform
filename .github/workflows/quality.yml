name: Code Quality & Linting

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

# Read-only by default; the one job that needs more (security-scan posts commit
# statuses) widens its own grant below.
permissions:
  contents: read

jobs:
  powershell-lint:
    name: PowerShell Linting & Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pwsh ships preinstalled on ubuntu-latest; actions/setup-powershell does not exist.
      # Pinned: an unpinned Install-Module made every run depend on whatever the
      # gallery served that day.
      - name: Install PSScriptAnalyzer
        run: |
          pwsh -NoProfile -Command "Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.25.0 -Force -Scope CurrentUser"

      # Blocking. The previous step passed one array to Invoke-ScriptAnalyzer's
      # string -Path parameter, failed to bind on every run, and sat behind
      # continue-on-error — so the analyzer never ran and this job was green by
      # construction. scripts/verify/psa-gate.ps1 analyzes file by file; an
      # Error-severity finding or an analyzer failure outside the legacy
      # baseline (.github/psa-baseline.txt) fails the job, warnings stay
      # advisory in the artifact and the step summary.
      - name: Run PSScriptAnalyzer gate
        run: |
          pwsh -NoProfile -File scripts/verify/psa-gate.ps1

      - name: Upload Analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: powershell-analysis
          path: ps-analysis.txt
          if-no-files-found: warn

  markdown-lint:
    name: Markdown Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # Plain npm install instead of the Docker-based action — same rationale
      # as ci-validation.yml: docker.io pulls flake on runners. Blocking: the
      # curated list below is clean, and a regression in one of these documents
      # must reach the required summary rather than hide behind continue-on-error.
      - name: Run Markdown Linter
        run: |
          npm install --global --no-fund --no-audit markdownlint-cli@0.33.0
          shopt -s nullglob
          files=(
            README.md
            docs/README.md
            docs/DOCUMENTATION_INDEX.md
            docs/CONSOLIDATION_BLUEPRINT.md
            docs/PROJECT_SETUP.md
            docs/OWNER_START_HERE.md
            docs/TEST_RUN_PLAYBOOK.md
            docs/ROADMAP.md
            docs/migration/yolkster-control-cutover/CANONICAL-ISSUE-LEDGER.md
            docs/migration/yolkster-control-cutover/CURRENT-AUTHORITY.md
            docs/migration/yolkster-control-cutover/CUTOVER-RUNBOOK.md
          )
          markdownlint --config .markdownlint.json "${files[@]}"

  json-validate:
    name: JSON Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # Blocking: the previous version counted errors inside a `find | while`
      # subshell (the count never reached the parent shell, so the step could not
      # fail) and sat behind continue-on-error. Now the first invalid file names
      # itself in an ::error annotation and xargs stops there (exit 255 aborts the
      # remaining invocations). *.code-workspace is JSON too (workspace.code-workspace).
      - name: Validate JSON files
        run: |
          set -euo pipefail
          find . \( -name '*.json' -o -name '*.code-workspace' \) \
            -not -path './node_modules/*' -not -path './.git/*' \
            -not -path './bin/*' -not -path './obj/*' -print0 |
            xargs -0 -n1 sh -c 'python3 -m json.tool "$1" >/dev/null 2>&1 || { echo "::error file=$1::invalid JSON: $1"; exit 255; }' _
          echo "✅ All JSON files valid"

  automation-validate:
    name: Automation Wiring Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The automation-wiring skill ships a validator that had no CI caller: it
      # parses every JSON/YAML artifact, and for workflows flags disabled or
      # stale actions, missing `permissions:`, attacker-controlled contexts
      # interpolated into `run:`/github-script, a write-token PR trigger paired
      # with a checkout, and jobs with neither `runs-on` nor `uses`; committed-credential
      # patterns are checked in every file it reads. Blocking: exit 1 on any
      # error; warnings (currently: three legacy workflows without a top-level
      # permissions block, one stale setup-python pin, terraform CLI absent)
      # print but pass. PyYAML is the validator's only dependency. Bicep and
      # Terraform sub-checks run only when those CLIs are on PATH; the
      # dedicated infra-validate.yml owns Bicep compilation, so this job does
      # not install either.
      - name: Validate workflows, config, editor, and infra artifacts
        run: |
          set -euo pipefail
          python -m pip install --quiet pyyaml==6.0.2
          python3 .claude/skills/automation-wiring/scripts/validate_all.py \
            .github/workflows config .vscode .devcontainer infra

  python-typecheck:
    # Lives here, not in python-spoke.yml: that workflow is path-filtered, so its
    # job can neither be a required context (it would never report on a PR that
    # touches no Python) nor feed the required Quality Check Summary. This
    # workflow runs on every PR, so a type error blocks the merge through the
    # summary below. pytest stays in python-spoke.yml.
    name: pyright (helios_agents)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/ai/python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Type-check the spoke package only (src/ai/python/pyrightconfig.json:
      # include helios_agents, standard mode, pythonVersion 3.10 = the package's
      # requires-python floor). The ml extras are installed so the optional
      # numpy/scikit-learn imports resolve instead of reading as missing
      # modules. Blocking: the package is clean at this pin, so any new finding
      # fails the job. The tests/ tree is deliberately outside the include — it
      # is loosely typed by design and stays covered by pytest.
      - name: Install package and pyright
        run: |
          python -m pip install '.[ml]'
          python -m pip install pyright==1.1.405

      - name: Run pyright
        run: python -m pyright

  security-scan:
    # "(quality)" suffix: ci-validation.yml publishes a job named "Security Scanning"
    # too, and two checks sharing one name are indistinguishable in the PR checks
    # list and in rulesets. Neither name is required by .github/rulesets/main.json.
    name: Security Scanning (quality)
    runs-on: ubuntu-latest
    # super-linter posts one commit status per linter (MULTI_STATUS) with
    # GITHUB_TOKEN, which needs statuses: write; the read grant is for checkout.
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v4

      - name: Run security scan
        uses: github/super-linter/slim@v4
        env:
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Changed files only (measured on PR #208): with the default whole-codebase
          # scope the per-linter statuses this job now publishes report the legacy
          # src/core status documents and tests/UAT.md - none of them touched by the
          # PR under review - so every PR read red for the same pre-existing lines.
          # Scoped to the diff against DEFAULT_BRANCH, a status names the PR's own
          # files; the legacy backlog is issue #144 (legacy removal).
          VALIDATE_ALL_CODEBASE: false
          # The repo's own markdownlint baseline (.markdownlint.json at the root, the
          # one the dedicated markdown-lint job above applies) instead of super-linter's
          # bundled template - one rule set for both jobs, so the two cannot disagree
          # about the same file. Other linters keep super-linter's defaults (a missing
          # rules file falls back to the bundled template).
          LINTER_RULES_PATH: .
          MARKDOWN_CONFIG_FILE: .markdownlint.json
          # The slim image carries no C# linter, so a VALIDATE_CSHARP flag here
          # was inert; C# is gated by dotnet-build.yml (build + tests).
          VALIDATE_JSON: true
          VALIDATE_MARKDOWN: true
        # Blocking (no continue-on-error): the scan is scoped to the PR's own
        # files, so a failure names a changed line, and it must reach the
        # required summary below.

  quality-summary:
    name: Quality Check Summary
    if: always()
    needs: [powershell-lint, markdown-lint, json-validate, automation-validate, python-typecheck, security-scan]
    runs-on: ubuntu-latest
    # Required context (.github/rulesets/main.json): it must carry the real
    # outcome of every job above, and no step in this workflow uses
    # continue-on-error any more, so a job result is its steps' real outcome.
    # Results reach the shell through env (never interpolated into run:), and
    # anything but success fails this job — a skipped or cancelled dependency
    # is not a pass either. (Six jobs; none of them is path-filtered.)
    env:
      RESULT_POWERSHELL_LINT: ${{ needs.powershell-lint.result }}
      RESULT_MARKDOWN_LINT: ${{ needs.markdown-lint.result }}
      RESULT_JSON_VALIDATE: ${{ needs.json-validate.result }}
      RESULT_AUTOMATION_VALIDATE: ${{ needs.automation-validate.result }}
      RESULT_PYTHON_TYPECHECK: ${{ needs.python-typecheck.result }}
      RESULT_SECURITY_SCAN: ${{ needs.security-scan.result }}
    steps:
      - name: Report Status
        shell: bash
        run: |
          set -u
          failed=0
          {
            echo "## Code Quality Results"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          for pair in \
            "PowerShell Lint=$RESULT_POWERSHELL_LINT" \
            "Markdown Lint=$RESULT_MARKDOWN_LINT" \
            "JSON Validation=$RESULT_JSON_VALIDATE" \
            "Automation Wiring Validation=$RESULT_AUTOMATION_VALIDATE" \
            "Python typecheck (pyright)=$RESULT_PYTHON_TYPECHECK" \
            "Security Scan=$RESULT_SECURITY_SCAN"; do
            name="${pair%%=*}"
            result="${pair#*=}"
            echo "- ${name}: ${result}" >> "$GITHUB_STEP_SUMMARY"
            if [ "$result" != "success" ]; then
              echo "::error::${name} finished with result '${result}'"
              failed=1
            fi
          done
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "$failed" -ne 0 ]; then
            echo "❌ Quality checks failed — see the job results above" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "✅ Quality checks completed" >> "$GITHUB_STEP_SUMMARY"
