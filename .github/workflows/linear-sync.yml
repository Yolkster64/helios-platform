name: Linear Sync

# Mirrors labeled GitHub issues into Linear so the Linear board and the GitHub
# Project dashboard rank the same work. One-directional by design (GitHub is
# the source of truth for engineering issues here); Linear-side edits are not
# synced back. Disabled connectors skip; enabled but unconfigured connectors fail.
#
# Team key, label routing, and the title prefix live in config/connectors.json;
# the secret is supplied securely with: gh secret set LINEAR_API_KEY

on:
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened]

# One run at a time per issue: two label events racing on a not-yet-mirrored
# issue would both miss the existing_id lookup and each create a Linear issue.
# Queued rather than cancelled so a running mutation always finishes; the
# label mutation re-reads live labels, so whichever run executes last still
# converges on GitHub's current truth.
concurrency:
  group: linear-sync-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  sync:
    name: Sync issue to Linear
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout connector script and config
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            config
            scripts/connectors

      - name: Sync
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_STATE: ${{ github.event.issue.state }}
          ISSUE_LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
          EVENT_ACTION: ${{ github.event.action }}
          REPO: ${{ github.repository }}
        run: bash scripts/connectors/linear-sync.sh
