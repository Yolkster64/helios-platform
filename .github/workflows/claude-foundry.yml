name: Claude Code on Microsoft Foundry

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      mode:
        description: Claude operation mode
        required: true
        type: choice
        default: review
        options:
          - review
          - implement
      prompt:
        description: Task for Claude Code
        required: true
        type: string

# Jobs opt into only the permissions they need. The Azure-authenticated implementation
# job is intentionally read-only to GitHub; a separate job publishes its patch without
# any Azure/OIDC permission.
permissions: {}

concurrency:
  group: claude-foundry-${{ github.event_name }}-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

env:
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'rg-helios-ai' }}
  CLAUDE_CODE_USE_FOUNDRY: '1'
  ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ vars.ANTHROPIC_DEFAULT_SONNET_MODEL || 'claude-sonnet-4-6' }}
  ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ vars.ANTHROPIC_DEFAULT_HAIKU_MODEL || 'claude-haiku-4-5' }}
  ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ vars.ANTHROPIC_DEFAULT_OPUS_MODEL || 'claude-opus-4-6' }}

jobs:
  owner-comment-review:
    name: Owner @claude review
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      github.actor == github.repository_owner &&
      contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false

      - name: Check Azure OIDC configuration
        id: oidc
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          if [ -n "$AZURE_CLIENT_ID" ] && [ -n "$AZURE_TENANT_ID" ] && [ -n "$AZURE_SUBSCRIPTION_ID" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Claude Foundry skipped: set AZURE_CLIENT_ID, AZURE_TENANT_ID, and AZURE_SUBSCRIPTION_ID as repository variables after configuring GitHub OIDC.'
          fi

      - name: Azure login with GitHub OIDC
        if: steps.oidc.outputs.configured == 'true'
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve Foundry resource
        if: steps.oidc.outputs.configured == 'true'
        env:
          CONFIGURED_RESOURCE: ${{ vars.ANTHROPIC_FOUNDRY_RESOURCE }}
        run: |
          resource="$CONFIGURED_RESOURCE"
          if [ -z "$resource" ]; then
            mapfile -t resources < <(az cognitiveservices account list \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query "[?kind=='AIServices'].name" -o tsv)
            if [ "${#resources[@]}" -ne 1 ]; then
              echo "Expected exactly one AIServices Foundry account in $AZURE_RESOURCE_GROUP; found ${#resources[@]}. Set ANTHROPIC_FOUNDRY_RESOURCE as a repository variable." >&2
              exit 1
            fi
            resource="${resources[0]}"
          fi
          echo "ANTHROPIC_FOUNDRY_RESOURCE=$resource" >> "$GITHUB_ENV"
          echo "Using Foundry resource: $resource"

      - name: Claude PR review
        if: steps.oidc.outputs.configured == 'true'
        uses: anthropics/claude-code-action@239e3a730883eeb5c53db12b0fc9573b3024b126
        with:
          use_foundry: true
          github_token: ${{ github.token }}
          settings: .claude/settings.json
          prompt: ${{ github.event.comment.body }}
          claude_args: >-
            --permission-mode dontAsk
            --max-turns 20
            --allowedTools "Read,Glob,Grep,Bash(git diff *),Bash(git status *),Bash(dotnet build *),Bash(dotnet test *),Bash(python3 -m pytest *),Bash(python3 -m compileall *)"
            --disallowedTools "Edit,Write,Bash(az *),Bash(git push *),Bash(gh *),Bash(curl *),Bash(wget *)"
          use_sticky_comment: true
          show_full_output: false
          display_report: false

  manual-review:
    name: Manual Claude review
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.actor == github.repository_owner &&
      inputs.mode == 'review' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false

      - name: Azure login with GitHub OIDC
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve Foundry resource
        env:
          CONFIGURED_RESOURCE: ${{ vars.ANTHROPIC_FOUNDRY_RESOURCE }}
        run: |
          resource="$CONFIGURED_RESOURCE"
          if [ -z "$resource" ]; then
            mapfile -t resources < <(az cognitiveservices account list \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query "[?kind=='AIServices'].name" -o tsv)
            if [ "${#resources[@]}" -ne 1 ]; then
              echo "Expected exactly one AIServices Foundry account in $AZURE_RESOURCE_GROUP; found ${#resources[@]}. Set ANTHROPIC_FOUNDRY_RESOURCE." >&2
              exit 1
            fi
            resource="${resources[0]}"
          fi
          echo "ANTHROPIC_FOUNDRY_RESOURCE=$resource" >> "$GITHUB_ENV"

      - name: Run read-only Claude review
        uses: anthropics/claude-code-action@239e3a730883eeb5c53db12b0fc9573b3024b126
        with:
          use_foundry: true
          settings: .claude/settings.json
          prompt: ${{ inputs.prompt }}
          claude_args: >-
            --permission-mode dontAsk
            --max-turns 20
            --allowedTools "Read,Glob,Grep,Bash(git diff *),Bash(git status *),Bash(dotnet build *),Bash(dotnet test *),Bash(python3 -m pytest *),Bash(python3 -m compileall *)"
            --disallowedTools "Edit,Write,Bash(az *),Bash(git push *),Bash(gh *),Bash(curl *),Bash(wget *)"
          show_full_output: false
          display_report: false

  claude-patch:
    name: Claude implementation patch
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.actor == github.repository_owner &&
      inputs.mode == 'implement' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Checkout main without write credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false

      - name: Azure login with GitHub OIDC
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve Foundry resource
        env:
          CONFIGURED_RESOURCE: ${{ vars.ANTHROPIC_FOUNDRY_RESOURCE }}
        run: |
          resource="$CONFIGURED_RESOURCE"
          if [ -z "$resource" ]; then
            mapfile -t resources < <(az cognitiveservices account list \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query "[?kind=='AIServices'].name" -o tsv)
            if [ "${#resources[@]}" -ne 1 ]; then
              echo "Expected exactly one AIServices Foundry account in $AZURE_RESOURCE_GROUP; found ${#resources[@]}. Set ANTHROPIC_FOUNDRY_RESOURCE." >&2
              exit 1
            fi
            resource="${resources[0]}"
          fi
          echo "ANTHROPIC_FOUNDRY_RESOURCE=$resource" >> "$GITHUB_ENV"

      - name: Let Claude edit the isolated checkout
        uses: anthropics/claude-code-action@239e3a730883eeb5c53db12b0fc9573b3024b126
        with:
          use_foundry: true
          settings: .claude/settings.json
          prompt: ${{ inputs.prompt }}
          claude_args: >-
            --permission-mode dontAsk
            --max-turns 30
            --allowedTools "Read,Glob,Grep,Edit,Write,Bash(git diff *),Bash(git status *),Bash(dotnet build *),Bash(dotnet test *),Bash(python3 -m pytest *),Bash(python3 -m compileall *)"
            --disallowedTools "Bash(az *),Bash(git push *),Bash(gh *),Bash(curl *),Bash(wget *),Bash(rm -rf *),Bash(sudo *)"
          show_full_output: false
          display_report: false

      - name: Capture Claude changes as a patch
        run: |
          git add -N .
          git diff --binary > claude.patch
          if [ ! -s claude.patch ]; then
            echo 'Claude produced no repository changes.' >&2
            exit 2
          fi
          git diff --stat

      - name: Upload patch
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: claude-foundry-patch-${{ github.run_id }}
          path: claude.patch
          retention-days: 7

  publish-patch:
    name: Validate and publish Claude patch
    needs: claude-patch
    if: needs.claude-patch.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout current main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main

      - name: Download patch
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: claude-foundry-patch-${{ github.run_id }}

      - name: Apply patch
        run: git apply --index --3way claude.patch

      - name: Deterministic validation outside Claude
        run: |
          ./scripts/build/build-native.sh
          dotnet build HELIOS.sln -c Release --nologo
          dotnet test tests/HELIOS.AIHub.Tests -c Release --nologo -v q
          python3 -m compileall -q src/ai/python
          (cd src/ai/python && python3 -m pytest tests -q)
          az bicep build --file infra/main.bicep --stdout > /dev/null

      - name: Commit patch to a dedicated branch
        env:
          BRANCH_NAME: claude/foundry-${{ github.run_id }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH_NAME"
          git commit -m "chore(claude): apply Foundry-assisted patch"
          git push --set-upstream origin "$BRANCH_NAME"

      - name: Open draft pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: claude/foundry-${{ github.run_id }}
          TASK_PROMPT: ${{ inputs.prompt }}
        run: |
          cat > /tmp/claude-pr.md <<'EOF'
          ## Claude Code / Microsoft Foundry patch

          Generated in an Azure-authenticated, GitHub-read-only job and published by a separate GitHub-write job with no Azure OIDC token.

          Deterministic native, .NET, Python, and Bicep validation passed before publication.

          No automatic merge or Azure deployment is requested by this workflow.
          EOF
          printf '\n### Requested task\n\n%s\n' "$TASK_PROMPT" >> /tmp/claude-pr.md
          gh pr create \
            --draft \
            --base main \
            --head "$BRANCH_NAME" \
            --title "Claude Foundry: ${TASK_PROMPT:0:72}" \
            --body-file /tmp/claude-pr.md
