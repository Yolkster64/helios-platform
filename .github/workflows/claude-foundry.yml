name: Claude Code on Microsoft Foundry

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Claude operation mode
        required: true
        type: choice
        default: review
        options:
          - review
          - implement
      prompt:
        description: Task for Claude Code
        required: true
        type: string

# Azure-authenticated jobs never receive repository write permission. Publishing a
# Claude-generated patch happens in a separate job with no id-token permission.
permissions: {}

concurrency:
  group: claude-foundry-${{ github.run_id }}
  cancel-in-progress: false

env:
  CLAUDE_CODE_USE_FOUNDRY: '1'
  ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ vars.ANTHROPIC_DEFAULT_SONNET_MODEL || 'claude-sonnet-4-6' }}
  ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ vars.ANTHROPIC_DEFAULT_HAIKU_MODEL || 'claude-haiku-4-5' }}
  ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ vars.ANTHROPIC_DEFAULT_OPUS_MODEL || 'claude-opus-4-6' }}

jobs:
  review:
    name: Read-only Claude review
    if: >-
      github.actor == github.repository_owner &&
      github.ref == 'refs/heads/main' &&
      inputs.mode == 'review'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout main without write credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false

      - name: Check dedicated Claude OIDC configuration
        env:
          CLIENT_ID: ${{ vars.CLAUDE_AZURE_CLIENT_ID || secrets.CLAUDE_AZURE_CLIENT_ID || vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID || secrets.AZURE_OIDC_CLIENT_ID }}
          TENANT_ID: ${{ vars.CLAUDE_AZURE_TENANT_ID || secrets.CLAUDE_AZURE_TENANT_ID || vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID || secrets.AZURE_OIDC_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ vars.CLAUDE_AZURE_SUBSCRIPTION_ID || secrets.CLAUDE_AZURE_SUBSCRIPTION_ID || vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID || secrets.AZURE_OIDC_SUBSCRIPTION_ID }}
          FOUNDRY_RESOURCE: ${{ vars.ANTHROPIC_FOUNDRY_RESOURCE || secrets.ANTHROPIC_FOUNDRY_RESOURCE }}
        run: |
          missing=()
          [ -n "$CLIENT_ID" ] || missing+=(CLAUDE_AZURE_CLIENT_ID)
          [ -n "$TENANT_ID" ] || missing+=(CLAUDE_AZURE_TENANT_ID)
          [ -n "$SUBSCRIPTION_ID" ] || missing+=(CLAUDE_AZURE_SUBSCRIPTION_ID)
          [ -n "$FOUNDRY_RESOURCE" ] || missing+=(ANTHROPIC_FOUNDRY_RESOURCE)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Claude Foundry OIDC is not configured. Missing: ${missing[*]}"
            echo "::error::Run: pwsh scripts/bootstrap/claude-foundry-oidc-setup.ps1"
            exit 1
          fi

      - name: Azure login with GitHub OIDC
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6
        with:
          client-id: ${{ vars.CLAUDE_AZURE_CLIENT_ID || secrets.CLAUDE_AZURE_CLIENT_ID || vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID || secrets.AZURE_OIDC_CLIENT_ID }}
          tenant-id: ${{ vars.CLAUDE_AZURE_TENANT_ID || secrets.CLAUDE_AZURE_TENANT_ID || vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID || secrets.AZURE_OIDC_TENANT_ID }}
          subscription-id: ${{ vars.CLAUDE_AZURE_SUBSCRIPTION_ID || secrets.CLAUDE_AZURE_SUBSCRIPTION_ID || vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID || secrets.AZURE_OIDC_SUBSCRIPTION_ID }}

      - name: Verify Foundry token acquisition
        run: az account get-access-token --scope https://ai.azure.com/.default --query expiresOn --output tsv > /dev/null

      - name: Run Claude Code review through Microsoft Foundry
        env:
          ANTHROPIC_FOUNDRY_RESOURCE: ${{ vars.ANTHROPIC_FOUNDRY_RESOURCE || secrets.ANTHROPIC_FOUNDRY_RESOURCE }}
        uses: anthropics/claude-code-action@239e3a730883eeb5c53db12b0fc9573b3024b126
        with:
          use_foundry: true
          settings: .claude/settings.json
          prompt: ${{ inputs.prompt }}
          claude_args: >-
            --permission-mode dontAsk
            --max-turns 20
            --allowedTools "Read,Glob,Grep,Bash(git diff *),Bash(git status *),Bash(dotnet build *),Bash(dotnet test *),Bash(python3 -m pytest *),Bash(python3 -m compileall *)"
            --disallowedTools "Edit,Write,Bash(az *),Bash(git push *),Bash(gh *),Bash(curl *),Bash(wget *),Bash(sudo *)"
          show_full_output: false
          display_report: false

  implement:
    name: Claude implementation patch
    if: >-
      github.actor == github.repository_owner &&
      github.ref == 'refs/heads/main' &&
      inputs.mode == 'implement'
    runs-on: ubuntu-latest
    outputs:
      base_sha: ${{ steps.base.outputs.sha }}
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Checkout main without write credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false

      - name: Capture immutable base commit
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check dedicated Claude OIDC configuration
        env:
          CLIENT_ID: ${{ vars.CLAUDE_AZURE_CLIENT_ID || secrets.CLAUDE_AZURE_CLIENT_ID || vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID || secrets.AZURE_OIDC_CLIENT_ID }}
          TENANT_ID: ${{ vars.CLAUDE_AZURE_TENANT_ID || secrets.CLAUDE_AZURE_TENANT_ID || vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID || secrets.AZURE_OIDC_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ vars.CLAUDE_AZURE_SUBSCRIPTION_ID || secrets.CLAUDE_AZURE_SUBSCRIPTION_ID || vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID || secrets.AZURE_OIDC_SUBSCRIPTION_ID }}
          FOUNDRY_RESOURCE: ${{ vars.ANTHROPIC_FOUNDRY_RESOURCE || secrets.ANTHROPIC_FOUNDRY_RESOURCE }}
        run: |
          missing=()
          [ -n "$CLIENT_ID" ] || missing+=(CLAUDE_AZURE_CLIENT_ID)
          [ -n "$TENANT_ID" ] || missing+=(CLAUDE_AZURE_TENANT_ID)
          [ -n "$SUBSCRIPTION_ID" ] || missing+=(CLAUDE_AZURE_SUBSCRIPTION_ID)
          [ -n "$FOUNDRY_RESOURCE" ] || missing+=(ANTHROPIC_FOUNDRY_RESOURCE)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Claude Foundry OIDC is not configured. Missing: ${missing[*]}"
            echo "::error::Run: pwsh scripts/bootstrap/claude-foundry-oidc-setup.ps1"
            exit 1
          fi

      - name: Azure login with GitHub OIDC
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6
        with:
          client-id: ${{ vars.CLAUDE_AZURE_CLIENT_ID || secrets.CLAUDE_AZURE_CLIENT_ID || vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID || secrets.AZURE_OIDC_CLIENT_ID }}
          tenant-id: ${{ vars.CLAUDE_AZURE_TENANT_ID || secrets.CLAUDE_AZURE_TENANT_ID || vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID || secrets.AZURE_OIDC_TENANT_ID }}
          subscription-id: ${{ vars.CLAUDE_AZURE_SUBSCRIPTION_ID || secrets.CLAUDE_AZURE_SUBSCRIPTION_ID || vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID || secrets.AZURE_OIDC_SUBSCRIPTION_ID }}

      - name: Verify Foundry token acquisition
        run: az account get-access-token --scope https://ai.azure.com/.default --query expiresOn --output tsv > /dev/null

      - name: Let Claude edit the isolated checkout
        env:
          ANTHROPIC_FOUNDRY_RESOURCE: ${{ vars.ANTHROPIC_FOUNDRY_RESOURCE || secrets.ANTHROPIC_FOUNDRY_RESOURCE }}
        uses: anthropics/claude-code-action@239e3a730883eeb5c53db12b0fc9573b3024b126
        with:
          use_foundry: true
          settings: .claude/settings.json
          prompt: ${{ inputs.prompt }}
          claude_args: >-
            --permission-mode dontAsk
            --max-turns 30
            --allowedTools "Read,Glob,Grep,Edit,Write,Bash(git diff *),Bash(git status *),Bash(dotnet build *),Bash(dotnet test *),Bash(python3 -m pytest *),Bash(python3 -m compileall *)"
            --disallowedTools "Bash(az *),Bash(git push *),Bash(gh *),Bash(curl *),Bash(wget *),Bash(rm -rf *),Bash(sudo *)"
          show_full_output: false
          display_report: false

      - name: Capture Claude changes as a patch
        run: |
          git add -N .
          git diff --binary > claude.patch
          test -s claude.patch || { echo 'Claude produced no repository changes.' >&2; exit 2; }
          git diff --stat

      - name: Upload patch
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: claude-foundry-patch-${{ github.run_id }}
          path: claude.patch
          retention-days: 7

  validate:
    name: Validate Claude patch without Azure credentials
    needs: implement
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false

      - name: Verify immutable base commit
        env:
          EXPECTED_BASE_SHA: ${{ needs.implement.outputs.base_sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          [ "$actual" = "$EXPECTED_BASE_SHA" ] || {
            echo "::error::main moved after implement started; expected $EXPECTED_BASE_SHA but found $actual"
            exit 1
          }

      - name: Download patch
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: claude-foundry-patch-${{ github.run_id }}

      - name: Apply patch
        run: git apply --index --3way claude.patch

      - name: Deterministic validation outside Claude
        run: |
          ./scripts/build/build-native.sh
          dotnet build HELIOS.sln -c Release --nologo
          dotnet test tests/HELIOS.AIHub.Tests -c Release --nologo -v q
          python3 -m pip install --disable-pip-version-check pytest
          python3 -m compileall -q src/ai/python
          (cd src/ai/python && python3 -m pytest tests -q)
          az bicep build --file infra/main.bicep --stdout > /dev/null

  publish:
    name: Publish validated Claude patch without Azure credentials
    needs: [implement, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main

      - name: Verify immutable base commit
        env:
          EXPECTED_BASE_SHA: ${{ needs.implement.outputs.base_sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          [ "$actual" = "$EXPECTED_BASE_SHA" ] || {
            echo "::error::main moved after implement started; expected $EXPECTED_BASE_SHA but found $actual"
            exit 1
          }

      - name: Download patch
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: claude-foundry-patch-${{ github.run_id }}

      - name: Apply patch
        run: git apply --index --3way claude.patch

      - name: Commit patch to a dedicated branch
        env:
          BRANCH_NAME: claude/foundry-${{ github.run_id }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH_NAME"
          git commit -m 'chore(claude): apply Foundry-assisted patch'
          git push --set-upstream origin "$BRANCH_NAME"

      - name: Open draft pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: claude/foundry-${{ github.run_id }}
          TASK_PROMPT: ${{ inputs.prompt }}
        run: |
          cat > /tmp/claude-pr.md <<'EOF'
          ## Claude Code / Microsoft Foundry patch

          Generated in an Azure-authenticated, GitHub-read-only job and published by a separate GitHub-write job that never receives an Azure OIDC token.

          Native, .NET, Python, and Bicep validation passed before publication.

          No automatic merge or Azure deployment is requested.
          EOF
          printf '\n### Requested task\n\n%s\n' "$TASK_PROMPT" >> /tmp/claude-pr.md
          gh pr create --draft --base main --head "$BRANCH_NAME" \
            --title "Claude Foundry: ${TASK_PROMPT:0:72}" --body-file /tmp/claude-pr.md
