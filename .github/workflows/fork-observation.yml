name: Fork Observation

# Weekly, read-only watch of the upstream repos listed in config/fork-watch.json:
# latest release + recent commit activity, fetched with plain curl against the GitHub
# REST API using the workflow GITHUB_TOKEN (public repos; no gh CLI, no extra secrets).
#
# The digest is uploaded as a workflow artifact and written to the job step summary —
# deliberately NO pushes and NO PRs from CI. A human reviews each digest and, when it is
# worth keeping, commits it to docs/observations/<year>-w<week>.md through a normal PR.
# API failures and rate limits degrade to "unavailable" lines inside the digest, so the
# job stays deterministically green. Design: docs/architecture/FORK_OBSERVATION.md.

on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC — off the :00 spike where shared-runner queues and API limits are worst
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A malformed watch list is a repo defect and SHOULD fail the run — this is the
      # only step allowed to go red. Everything network-flavored degrades gracefully.
      - name: Validate watch list
        run: |
          mkdir -p "$RUNNER_TEMP/fork-watch"
          python3 - "$RUNNER_TEMP/fork-watch/repos.txt" <<'EOF'
          import json, re, sys

          ALLOWED_SIGNALS = {"releases", "commits"}
          REPO_RE = re.compile(r"^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$")

          with open("config/fork-watch.json") as f:
              cfg = json.load(f)
          repos = cfg.get("repos")
          if not isinstance(repos, list) or not repos:
              sys.exit("config/fork-watch.json: 'repos' must be a non-empty list")
          slugs = []
          for entry in repos:
              repo = entry.get("repo", "")
              if not REPO_RE.match(repo):
                  sys.exit(f"fork-watch entry has an invalid repo slug: {repo!r}")
              if not entry.get("because", "").strip():
                  sys.exit(f"{repo}: 'because' (the why-watched note) is required")
              unknown = set(entry.get("signals", [])) - ALLOWED_SIGNALS
              if unknown:
                  sys.exit(f"{repo}: unknown signals {sorted(unknown)}")
              slugs.append(repo)
          with open(sys.argv[1], "w") as f:
              f.write("\n".join(slugs) + "\n")
          print(f"OK: {len(slugs)} watched repos")
          EOF

      - name: Fetch upstream signals (rate-limit tolerant)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Every curl outcome — including 403/429 rate limiting and outages — is
          # recorded as an HTTP-code file and rendered as "unavailable" downstream.
          # This step never fails the job.
          work="$RUNNER_TEMP/fork-watch"
          since="$(date -u -d '14 days ago' +%Y-%m-%dT%H:%M:%SZ)"
          printf '%s\n' "$since" > "$work/since.txt"
          while IFS= read -r repo; do
            slug="${repo//\//__}"
            for kind in releases commits; do
              if [ "$kind" = "releases" ]; then
                url="https://api.github.com/repos/${repo}/releases/latest"
              else
                url="https://api.github.com/repos/${repo}/commits?since=${since}&per_page=100"
              fi
              code=$(curl -sS --max-time 30 \
                -o "$work/${slug}.${kind}.json" -w '%{http_code}' \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "$url") || code=000
              printf '%s\n' "$code" > "$work/${slug}.${kind}.code"
              echo "${repo} ${kind}: HTTP ${code}"
            done
          done < "$work/repos.txt"

      - name: Render digest (artifact file + step summary)
        run: |
          python3 - <<'EOF'
          import datetime, json, os, pathlib

          work = pathlib.Path(os.environ["RUNNER_TEMP"]) / "fork-watch"
          with open("config/fork-watch.json") as f:
              cfg = json.load(f)
          since = (work / "since.txt").read_text().strip()
          now = datetime.datetime.now(datetime.timezone.utc)
          iso = now.isocalendar()
          week_id = f"{iso[0]}-w{iso[1]:02d}"

          def load(slug, kind):
              code_path = work / f"{slug}.{kind}.code"
              body_path = work / f"{slug}.{kind}.json"
              code = code_path.read_text().strip() if code_path.exists() else "000"
              data = None
              if code == "200" and body_path.exists():
                  try:
                      data = json.loads(body_path.read_text())
                  except ValueError:
                      code = "bad-json"
              return code, data

          lines = [
              f"# Fork observation digest — {week_id}",
              "",
              f"Generated {now:%Y-%m-%d %H:%M} UTC by `fork-observation.yml`; commit window since {since}.",
              "",
              f"After manual review this file's home is `docs/observations/{week_id}.md` — committed by a human through a normal PR, never by CI (see docs/architecture/FORK_OBSERVATION.md).",
              "",
          ]
          for entry in cfg["repos"]:
              repo = entry["repo"]
              slug = repo.replace("/", "__")
              signals = entry.get("signals", [])
              lines += [f"## {repo}", "", f"*Why watched:* {entry['because']}", ""]
              if "releases" in signals:
                  code, rel = load(slug, "releases")
                  if code == "200" and isinstance(rel, dict):
                      tag = rel.get("tag_name") or "?"
                      lines.append(f"- Latest release: **{tag}** published {rel.get('published_at') or '?'} — {rel.get('html_url') or ''}")
                  elif code == "404":
                      lines.append("- Latest release: none published.")
                  else:
                      lines.append(f"- Latest release: unavailable (HTTP {code}; rate-limited or unreachable).")
              if "commits" in signals:
                  code, commits = load(slug, "commits")
                  if code == "200" and isinstance(commits, list):
                      suffix = "+" if len(commits) == 100 else ""
                      lines.append(f"- Commits since {since[:10]}: **{len(commits)}{suffix}**")
                      for c in commits[:5]:
                          sha = (c.get("sha") or "")[:7]
                          msg = ((c.get("commit") or {}).get("message") or "").splitlines()[0]
                          if len(msg) > 100:
                              msg = msg[:97] + "..."
                          lines.append(f"  - `{sha}` {msg}")
                  else:
                      lines.append(f"- Commit activity: unavailable (HTTP {code}; rate-limited or unreachable).")
              lines.append("")

          text = "\n".join(lines).rstrip() + "\n"
          digest_dir = work / "digest"
          digest_dir.mkdir(parents=True, exist_ok=True)
          out = digest_dir / f"{week_id}.md"
          out.write_text(text)
          print(f"Wrote {out} ({len(text)} bytes)")

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a") as f:
                  f.write(text)
          EOF

      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: fork-observation-digest
          path: ${{ runner.temp }}/fork-watch/digest/
          if-no-files-found: error
          retention-days: 90
