name: Slack Notifications

# Posts CI/deploy outcomes to Slack. Deliberately a separate workflow_run
# listener rather than steps inside each pipeline: the pipelines stay
# notification-agnostic, and adding a channel later means editing exactly one
# file. Disabled connectors skip; missing credentials or delivery errors fail
# this separate notifier workflow without changing the originating build result.
#
# Routing and notify policy live in config/connectors.json; the secret is set
# once via the secure prompt: gh secret set SLACK_WEBHOOK_URL

on:
  workflow_run:
    workflows:
      - ".NET Build & Test"
      - "Infra Validation"
      - "Python Spoke"
      - "Helios Platform Deploy"
      - "Absorption Benchmark"
      - "Docker Validation"
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  notify:
    name: Post outcome to Slack
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted connector script and config
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            config
            scripts/connectors

      - name: Post to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/connectors/slack-notify.py
