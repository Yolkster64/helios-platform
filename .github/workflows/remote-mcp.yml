name: HELIOS shared MCP bridge
on:
  pull_request:
    paths: ['src/mcp/**', 'src/ai/**', 'tests/HELIOS.AIHub.Tests/**', 'HELIOS.sln', 'Directory.Packages.props', '.github/workflows/remote-mcp.yml']
  push:
    branches: [main]
    paths: ['src/mcp/**', 'src/ai/**', 'tests/HELIOS.AIHub.Tests/**', 'HELIOS.sln', 'Directory.Packages.props', '.github/workflows/remote-mcp.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compile shared implementation
        run: dotnet build HELIOS.sln -c Release
      - name: Exercise AIHub, HTTP, authorization, process and handoff contracts
        run: dotnet test tests/HELIOS.AIHub.Tests -c Release --no-build --logger 'trx;LogFileName=remote-mcp.trx'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remote-mcp-tests
          path: tests/HELIOS.AIHub.Tests/TestResults/*.trx
