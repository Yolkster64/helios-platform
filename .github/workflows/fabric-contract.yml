name: Fabric contract and evidence

on:
  pull_request:
    paths:
      - 'config/fabric/helios-fabric.v1.json'
      - 'config/schemas/helios-fabric.v1.schema.json'
      - 'scripts/validation/validate_helios_fabric_contract.py'
      - 'scripts/validation/tests/test_validate_helios_fabric_contract.py'
      - 'src/ai/HELIOS.AIHub/Fabric/**'
      - 'src/mcp/HELIOS.Mcp/HeliosFabricPlanTools.cs'
      - 'tests/HELIOS.AIHub.Tests/Fabric/**'
      - 'tests/HELIOS.AIHub.Tests/McpFabricPlanToolTests.cs'
      - 'docs/mcp/CLIENT_SETUP.md'
      - 'docs/migration/yolkster-control-cutover/FABRIC-*.md'
      - '.claude/agents/fabric-activation.md'
      - '.claude/commands/activate-fabric-plane.md'
      - 'azure-pipelines.yml'
      - '.github/workflows/fabric-contract.yml'
  push:
    branches: [main]
    paths:
      - 'config/fabric/helios-fabric.v1.json'
      - 'config/schemas/helios-fabric.v1.schema.json'
      - 'scripts/validation/validate_helios_fabric_contract.py'
      - 'scripts/validation/tests/test_validate_helios_fabric_contract.py'
      - 'src/ai/HELIOS.AIHub/Fabric/**'
      - 'src/mcp/HELIOS.Mcp/HeliosFabricPlanTools.cs'
      - 'tests/HELIOS.AIHub.Tests/Fabric/**'
      - 'tests/HELIOS.AIHub.Tests/McpFabricPlanToolTests.cs'
      - 'docs/mcp/CLIENT_SETUP.md'
      - 'docs/migration/yolkster-control-cutover/FABRIC-*.md'
      - '.claude/agents/fabric-activation.md'
      - '.claude/commands/activate-fabric-plane.md'
      - 'azure-pipelines.yml'
      - '.github/workflows/fabric-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Fabric contract
        run: python3 scripts/validation/validate_helios_fabric_contract.py

      - name: Run Fabric validator mutation tests
        run: python3 -m unittest scripts.validation.tests.test_validate_helios_fabric_contract -v

  dotnet:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build portable solution
        run: dotnet build HELIOS.sln -c Release

      - name: Run Fabric-focused tests
        run: dotnet test tests/HELIOS.AIHub.Tests -c Release --filter "FullyQualifiedName~Fabric"

  mcp-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build portable solution
        run: dotnet build HELIOS.sln -c Release

      - name: Verify stack smoke and capture MCP tool catalog evidence
        run: pwsh scripts/verify/stack-smoke.ps1 -Json > stack-smoke.fabric.json

      - name: Upload Fabric MCP evidence
        uses: actions/upload-artifact@v4
        with:
          name: fabric-mcp-evidence
          path: stack-smoke.fabric.json
