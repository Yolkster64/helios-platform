services:
  postgres:
    image: postgres:16-alpine
    profiles: ["local-services"]
    environment:
      POSTGRES_DB: ${HELIOS_POSTGRES_DB:-helios_dev}
      POSTGRES_USER: ${HELIOS_POSTGRES_USER:-helios_dev_user}
      POSTGRES_PASSWORD: ${HELIOS_POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: UTC
    ports:
      - "127.0.0.1:${HELIOS_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
