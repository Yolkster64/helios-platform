services:
  postgres:
    profiles: ["database"]
    image: postgres:16-alpine
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    ports:
      - "127.0.0.1:${HELIOS_DEV_POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${HELIOS_DEV_POSTGRES_DB:-helios_dev}
      POSTGRES_USER: ${HELIOS_DEV_POSTGRES_USER:-helios_dev}
      POSTGRES_PASSWORD: ${HELIOS_DEV_POSTGRES_PASSWORD:?Set HELIOS_DEV_POSTGRES_PASSWORD or pass --env-file .devcontainer/local.env}
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: UTC
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data: {}
